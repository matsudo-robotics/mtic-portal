<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0043A8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://script.google.com https://script.googleusercontent.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; frame-src https://*.firebaseapp.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="description" content="NPO法人松戸技術革新センターM-TICのオンラインショップ。ロボット部品・キット・ものづくりの道具をお届けします。">
<title>M-TICオンラインショップ</title>
<style>
:root{
  --brand:#0043A8; --brand-dark:#00368a; --brand-ink:#0043A8; --accent:#F97300; --accent-ink:#B45309;
  --bg:#F6F8FC; --surface:#FFFFFF; --soft:#EEF2FA; --text:#1F2937; --muted:#5F6B7A; --line:#E1E7F0; --line-strong:#C9D2E0;
  --ok:#1E7B34; --ok-bg:#E6F4EA; --warn:#9A4A00; --warn-bg:#FFF0E2; --ng:#B42318; --ng-bg:#FDECEC; --info-bg:#E7EEFB;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06); --shadow-lg:0 18px 40px rgba(16,24,40,.16);
  --radius:16px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand-ink:#8DB2FF; --accent-ink:#FFB869;
    --bg:#0E1320; --surface:#182033; --soft:#1F2940; --text:#E6E9EF; --muted:#A3ADBE; --line:#2A3449; --line-strong:#3A4660;
    --ok:#8EE0A2; --ok-bg:#16301f; --warn:#FFB869; --warn-bg:#3A2716; --ng:#FF9C94; --ng-bg:#3a1b1b; --info-bg:#1B2B4D;
    --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 18px 40px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--brand-ink)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.35;margin:0 0 .5em}
[hidden],.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:32px;height:32px}
svg.i.xl{width:56px;height:56px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.logo .mark{font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--brand-ink)}
.logo .mark i{color:var(--accent);font-style:normal}
.logo .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600}
.cartbtn:hover{background:var(--soft)}
.cartbtn .n{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.cartbtn .n:empty{display:none}
.band{padding:10px 0;font-size:14px}
.band .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.band.info{background:var(--info-bg)}
.band.preview{background:var(--warn-bg);color:var(--warn);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:15px;font-weight:600;text-decoration:none;color:var(--text);transition:background .15s,transform .05s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 40%,transparent);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{filter:brightness(.95)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field>span em{font-style:normal;color:var(--ng);font-size:12px;margin-left:6px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=search],textarea,select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-strong);border-radius:12px;cursor:pointer;margin-bottom:8px;background:var(--surface)}
.opt input{width:20px;height:20px;margin-top:3px;flex:none}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.opt .t{font-weight:700}
.opt .d{font-size:13px;color:var(--muted)}
.opt.off{opacity:.5;cursor:not-allowed}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.hero{margin:40px auto;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:40px 28px;text-align:center}
.hero .art{width:160px;height:120px;margin:0 auto 18px}
.hero h1{font-size:26px;margin-bottom:10px}
.hero .lead{color:var(--muted);font-size:16px;white-space:pre-wrap;margin:0 auto 20px;max-width:560px}
.hero .chipline{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:14px;margin-bottom:16px}
.hero .contact{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.staffbox{margin-top:22px;padding:14px;border:1px dashed var(--line-strong);border-radius:14px;font-size:14px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0 14px}
.intro h1{font-size:24px;margin:0}
.intro p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);width:100%;height:100%}
.ph .code{font-family:var(--mono);font-size:13px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .nm{font-weight:700;font-size:16px;line-height:1.45;cursor:pointer}
.card .spec{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-size:20px;font-weight:800}
.price small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.av{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.av.ok{background:var(--ok-bg);color:var(--ok)}
.av.low{background:var(--warn-bg);color:var(--warn)}
.av.ng{background:var(--ng-bg);color:var(--ng)}
.av.mto{background:var(--info-bg);color:var(--brand-ink)}
.buy{display:flex;gap:8px;align-items:center;margin-top:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.qty button{width:40px;height:42px;border:0;background:transparent;cursor:pointer;font-size:18px}
.qty button:hover{background:var(--soft)}
.qty input{width:44px;height:42px;border:0;text-align:center;font-size:16px;background:transparent;padding:0;min-height:0;border-radius:0}
.buy .btn{flex:1;white-space:nowrap}
.card .buy{flex-direction:column;align-items:stretch}
.card .qty{justify-content:space-between}
.card .qty input{flex:1}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
dialog.dlg{border:0;border-radius:20px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg)}
dialog.dlg::backdrop{background:rgba(10,16,30,.5)}
.dlg .in{display:grid;grid-template-columns:1fr 1fr;gap:0;max-height:calc(100vh - 32px);overflow:auto}
.dlg .pic{background:var(--soft);min-height:260px;display:flex;align-items:center;justify-content:center}
.dlg .pic img{width:100%;height:100%;object-fit:cover}
.dlg .txt{padding:24px;display:flex;flex-direction:column;gap:10px}
.dlg .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.dlg .desc{white-space:pre-wrap;font-size:14px}
.page{margin:24px 0 40px}
.page h1{font-size:24px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel h2{font-size:17px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lines li:last-child{border-bottom:0}
.lines .th{width:64px;height:64px;border-radius:12px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.lines .th img{width:100%;height:100%;object-fit:cover}
.lines .nm{font-weight:700}
.lines .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lines .amt{font-weight:800;text-align:right;white-space:nowrap}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.sum .tot{font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.sum .note{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;margin:10px 0}
.msg.err{background:var(--ng-bg);color:var(--ng)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.info{background:var(--info-bg)}
.steps-mini{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.steps-mini b{color:var(--brand-ink)}
.done{max-width:640px;margin:32px auto;text-align:center}
.done .ic{width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.done .no{font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:.04em;background:var(--soft);display:inline-block;padding:8px 18px;border-radius:12px;margin:8px 0 16px}
.done ol{text-align:left;max-width:520px;margin:12px auto;padding-left:1.4em}
.legal{max-width:820px}
.legal table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.legal th,.legal td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:14px}
.legal th{width:32%;background:var(--soft);font-weight:700}
.legal tr:last-child th,.legal tr:last-child td{border-bottom:0}
.legal td{white-space:pre-wrap}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;white-space:pre-wrap;font-size:14px}
.foot{margin-top:auto;border-top:1px solid var(--line);background:var(--surface);padding:22px 0;font-size:13px;color:var(--muted)}
.foot .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot nav{display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:var(--muted)}
.foot .copy{display:flex;flex-direction:column;gap:2px;font-size:12px;text-align:right}
@media (max-width:640px){.foot .copy{text-align:left}}
.boot{display:flex;align-items:center;justify-content:center;min-height:60vh}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg);z-index:50;max-width:calc(100vw - 32px)}
@media (max-width:860px){
  .cols{grid-template-columns:1fr}
  .dlg .in{grid-template-columns:1fr}
  .dlg .pic{min-height:200px;max-height:300px}
}
@media (max-width:520px){
  .top .wrap{height:58px}
  .logo .nm{font-size:13px}
  .cartbtn .lb{display:none}
  .hero{margin:20px auto;padding:28px 18px;border-radius:18px}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card .body{padding:10px 12px 12px}
  .card .nm{font-size:14px}
  .price{font-size:17px}
  .buy{flex-direction:column;align-items:stretch}
  .card .buy .btn{padding:0 8px;font-size:14px;gap:4px}
  .qty{justify-content:space-between}
  .qty input{flex:1}
  .lines li{grid-template-columns:52px minmax(0,1fr)}
  .lines .th{width:52px;height:52px}
  .lines .amt{grid-column:2;text-align:left}
  .legal th{width:38%}
}
@media print{.top,.foot,.band{display:none}}
</style>
</head>
