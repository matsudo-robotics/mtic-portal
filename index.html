<!DOCTYPE html>
<!--
  ============================================================================
   M-TIC職員ポータル
   ファイル名 : index.html
   バージョン : v2.3（2026-10-13）
   置き場所   : GitHub Pages（公式HPとは別のリポジトリ mtic-portal を想定）
   しくみ     : 画面＝このHTML1枚（全部のアプリ入り） ／ サインインと保存＝Firebase（無料プラン）
                ／ メール通知・チャットのファイル保存・ショップの注文の受付＝裏方GAS（画面なし）
   いっしょに置くファイル
                config.js（設定・差し替えない） ／ vendor/（カメラ読み取り・QR作成の部品）
                ／ shop/（お客さま向けのオンラインショップ。いまは準備中）
  ----------------------------------------------------------------------------
   大事なこと
    ・このHTMLは誰でも見られます。パスワード・個人情報・フォームのURLは書かないこと
      （アプリのリンク先は、サインイン後の「リンク設定」から登録 → 会員だけが見られる場所に保存）
    ・Firebaseの設定は config.js に書きます（公開してよい値。守りはFirebaseのルールで行います）
      → 新しい版が出たら index.html（と vendor フォルダ）だけ差し替えればOK
    ・Firebase未設定のときは「デモ表示」で全部の画面を試せます（この端末の中だけに保存）
  ----------------------------------------------------------------------------
   アプリ一覧（CONFIG.APPS に1行足すとアイコンが増えます）
    毎日の業務   : タスカー／入退室／チャット／スケジュール（日程調整）／機材利用／申請・承認
    ものづくり   : 作業指示・工程票／作業手順書／点検・メンテ／在庫管理／POSレジ／オンラインショップ／受発注・案件／帳票
    経理         : 予算・決算／立替申請（外部リンク）
    開発ツール   : メカ・エレキ・ソフト支援 ほか（外部リンク）
    管理         : 会員管理（責任者）／IDカード／設定・診断／リンク設定
  ----------------------------------------------------------------------------
   変更履歴
    v2.3 (2026-10-13) 入退室のGoogleフォーム連携をつくりなおし：ポータルからつなぐ・過去の回答の取り込み・
                    名簿と合わない名前の対応・戸締り確認・シートとのそろえ直し（裏方GAS v2.2 が必要）／
                    在庫管理「カメラで読んで追加」（JANを読む → 登録ずみなら入庫・まだなら登録）
    v2.2 (2026-10-12) サインインの守りを強く：2段階認証（認証アプリの6けたのコード・職員以上は必須）・
                    タブを閉じたらサインアウト（端末に残さない。キオスクの端末だけ残す）・お店のページはサインインを写して開く
    v2.1 (2026-10-12) オンラインショップ（準備中）を付属：注文の対応・お客さまへのメール・在庫から出庫・
                    案件にする・載せる商品・お店の設定と表記（shop/index.html とつながる）
    v2.0 (2026-10-12) 全アプリを内蔵（タスカー・入退室・機材利用＋IDカード・点検メンテ・工程票・
                    作業手順書・在庫・POSレジ・受発注・帳票・日程調整・スケジュール・チャット）
    v1.0 (2026-10-12) 初版：ホーム・独自アカウントのサインイン・会員管理・リンク集
  ============================================================================
-->
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0043A8">
<meta name="referrer" content="same-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://script.google.com https://script.googleusercontent.com https://api.pwnedpasswords.com; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-src https://*.firebaseapp.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>M-TIC職員ポータル</title>
<style>
/* ==========================================================================
   M-TIC職員ポータル v2 スタイル
   色：ブランド青 #0043A8 ／ アクセント橙 #F97300 ／ 白背景・角丸カード
   ========================================================================== */
:root{
  --brand:#0043A8; --brand-ink:#0043A8; --brand-dark:#00368a; --accent:#F97300;
  --bg:#FFFFFF; --bg-soft:#F5F7FB; --bg-softer:#FAFBFD; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280; --line:#E3E8F0; --line-strong:#CBD3E1;
  --danger:#C62828; --ok:#1E8E3E; --warn:#B45309;
  --t-blue-bg:#E7EEFB; --t-blue-fg:#0043A8;
  --t-orange-bg:#FFF0E2; --t-orange-fg:#B45309;
  --t-violet-bg:#EFEAFE; --t-violet-fg:#5B3CC4;
  --t-aqua-bg:#E2F5F2; --t-aqua-fg:#0F766E;
  --t-gray-bg:#EEF0F3; --t-gray-fg:#4B5563;
  --t-red-bg:#FDECEC; --t-red-fg:#B42318;
  --t-green-bg:#E6F4EA; --t-green-fg:#1E7B34;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-hover:0 12px 28px rgba(16,24,40,.13);
  --radius:16px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --brand-ink:#8DB2FF; --bg:#0E1320; --bg-soft:#141B2B; --bg-softer:#111827; --surface:#182033; --text:#E6E9EF; --muted:#9AA4B5; --line:#283247; --line-strong:#38445c;
  --danger:#FF8A80; --ok:#7BD88F; --warn:#FFB869;
  --t-blue-bg:#1B2B4D; --t-blue-fg:#9EC0FF; --t-orange-bg:#3A2716; --t-orange-fg:#FFB869;
  --t-violet-bg:#2B2347; --t-violet-fg:#C7B8FF; --t-aqua-bg:#123632; --t-aqua-fg:#7FDCCF; --t-gray-bg:#232B3B; --t-gray-fg:#C2C9D6;
  --t-red-bg:#3a1b1b; --t-red-fg:#FF9C94; --t-green-bg:#16301f; --t-green-fg:#8EE0A2;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 12px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{line-height:1.35}
.hidden,[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.mono{font-family:var(--mono)}
.nw{white-space:nowrap}
.right{text-align:right}
.center-t{text-align:center}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:8px}
.sp{flex:1}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.num{font-variant-numeric:tabular-nums}
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--bg-soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px;gap:4px}
.btn.lg{height:52px;padding:0 22px;font-size:16px;border-radius:12px}
.btn.xl{height:72px;padding:0 26px;font-size:20px;border-radius:16px;font-weight:700}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand-ink);cursor:pointer;padding:4px 0;font-size:13px;text-decoration:underline}

/* ---------- 入力 ---------- */
label.field,.field{display:block;margin:0 0 12px}
.field>span.lb,label.field>span:first-child{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field .req{color:var(--danger);margin-left:3px}
.field .help{font-size:12px;color:var(--muted);margin-top:3px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=search],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=datetime-local],input[type=month],select,textarea{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=number]{text-align:right}
input.inp-sm,select.inp-sm{height:34px;border-radius:8px;padding:0 8px;font-size:14px}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input[readonly]{background:var(--bg-soft)}
input:invalid{box-shadow:none}
.inp-unit{display:flex;align-items:center;gap:6px}
.inp-scan{display:flex;align-items:center;gap:6px}.inp-scan>input,.inp-scan>div{flex:1;min-width:0}.inp-scan>.btn{flex:none}
.inp-unit>span{color:var(--muted);font-size:13px;white-space:nowrap}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:46px}
.pw-wrap .eye{position:absolute;right:4px;top:4px;height:34px;width:38px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0 12px;cursor:pointer}
.check input{margin-top:4px;width:16px;height:16px;flex:none}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 12px}
.form>.field,.form>.full{grid-column:span 6}
.form>.w1{grid-column:span 1}.form>.w2{grid-column:span 2}.form>.w3{grid-column:span 3}.form>.w4{grid-column:span 4}.form>.w5{grid-column:span 5}
.form>h4{grid-column:span 6;margin:8px 0 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
@media (max-width:639px){.form>.w1,.form>.w2,.form>.w3,.form>.w4,.form>.w5{grid-column:span 6}.form>.w1.keep,.form>.w2.keep{grid-column:span 3}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on,.chip:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.chip.ok.on,.chip.ok:has(input:checked){background:var(--ok);border-color:var(--ok)}
.chip.ng.on,.chip.ng:has(input:checked){background:var(--danger);border-color:var(--danger)}
.chip.mid.on,.chip.mid:has(input:checked){background:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;margin:8px 0}
.msg.err{background:var(--t-red-bg);color:var(--t-red-fg)}
.msg.ok{background:var(--t-green-bg);color:var(--t-green-fg)}
.msg.info{background:var(--bg-soft);color:var(--muted)}
.msg.warn{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.tip{font-size:12.5px;color:var(--muted);background:var(--bg-soft);border-radius:10px;padding:10px 12px;margin:10px 0}

/* ---------- バッジ・状態 ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--t-orange-bg);color:var(--t-orange-fg);font-weight:600;white-space:nowrap}
.badge.blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.badge.gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}
.badge.red{background:var(--t-red-bg);color:var(--t-red-fg)}
.badge.green{background:var(--t-green-bg);color:var(--t-green-fg)}
.badge.violet{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.badge.aqua{background:var(--t-aqua-bg);color:var(--t-aqua-fg)}
.st{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.c-blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.c-orange{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.c-violet{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.c-aqua{background:var(--t-aqua-bg);color:var(--t-aqua-fg)}
.c-gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}
.c-red{background:var(--t-red-bg);color:var(--t-red-fg)}
.c-green{background:var(--t-green-bg);color:var(--t-green-fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}.dot.warn{background:var(--accent)}.dot.ng{background:var(--danger)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700}
.count.blue{background:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--t-blue-bg);color:var(--t-blue-fg);font-size:11px;font-weight:700;border:0;white-space:nowrap;letter-spacing:-.03em;overflow:hidden;flex:none}
button.avatar{cursor:pointer}
.avatar.sm{width:28px;height:28px;font-size:10px}
.avatar.lg{width:56px;height:56px;font-size:16px}

/* ---------- サインイン系 ---------- */
.center{display:flex;align-items:center;justify-content:center;padding:32px 16px;min-height:100vh;background:var(--bg-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:420px}
.card.wide{max-width:560px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--brand-ink)}
.logo .mark i{color:var(--accent);font-style:normal}
.logo img{height:34px;width:auto}
.card h1{font-size:20px;margin:14px 0 4px}
.card .lead{font-size:13.5px;color:var(--muted);margin:0 0 18px}
.divider{height:1px;background:var(--line);margin:18px 0}
ul.rules{list-style:none;padding:0;margin:6px 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12.5px}
ul.rules li{color:var(--muted)}
ul.rules li::before{content:"・";}
ul.rules li.ok{color:var(--ok)}
ul.rules li.ok::before{content:"✓ ";}
ul.rules li.ng::before{content:"× ";color:var(--danger)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.meter>div{height:100%;width:0;background:var(--danger);transition:width .2s,background .2s}
@media (max-width:639px){ul.rules{grid-template-columns:1fr}}

/* ---------- ヘッダー ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px;min-height:56px}
.top .apptitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;min-width:0}
.top .apptitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .apptitle .ic{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.top .apptitle .ic svg{width:18px;height:18px}
.top .tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--bg-soft);white-space:nowrap}
.status .dot{background:var(--ok)}
.status.saving .dot{background:var(--accent)}
.status.offline .dot{background:var(--danger)}
@media (max-width:639px){.top-in{padding:6px 12px;gap:6px}.status .stx{display:none}.top .hide-sm{display:none}}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;min-width:250px;max-width:calc(100vw - 24px)}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px}
.menu .who b{display:block;font-size:14px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.menu button:hover{background:var(--bg-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---------- ホーム ---------- */
main.home{max-width:1240px;margin:0 auto;padding:20px 20px 40px}
.hello{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.hello h1{font-size:20px;margin:0}
.search{position:relative;max-width:520px;margin:0 0 12px}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.search input{padding-left:40px;border-radius:12px;background:var(--bg-soft)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:10px 14px;border-radius:12px;background:var(--t-orange-bg);color:var(--t-orange-fg)}
.alert.blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.alert .btn{margin-left:auto}
.widgets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 6px}
@media (max-width:1023px){.widgets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:479px){.widgets{grid-template-columns:1fr}}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;min-height:96px;transition:border-color .15s}
.wcard:hover{border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.wcard h3{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
.wcard .big{font-size:22px;font-weight:800}
.wcard ul{list-style:none;margin:0;padding:0;font-size:13px}
.wcard li{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
section.sec{margin:22px 0 0}
section.sec>h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:1023px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:639px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}main.home{padding:14px 12px 32px}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--text);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s;text-align:center;min-height:128px;font-size:13.5px;-webkit-tap-highlight-color:transparent}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}
.tile:active{transform:translateY(-1px)}
.tile .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:28px;height:28px;stroke-width:1.7}
.tile .lb{line-height:1.35;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.tile .tag{position:absolute;top:8px;right:8px;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--t-gray-bg);color:var(--t-gray-fg);font-weight:600}
.tile .tag.hot{background:var(--accent);color:#fff}
.tile .tag.blue{background:var(--brand);color:#fff}
@media (max-width:639px){.tile{min-height:108px;padding:14px 4px 10px;font-size:12px}.tile .ic{width:48px;height:48px;border-radius:14px}.tile .ic svg{width:24px;height:24px}.tile .tag{top:4px;right:4px;font-size:10px;padding:0 6px}}
footer.foot{border-top:1px solid var(--line);margin-top:34px;padding:16px 0 0;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
footer.foot .v{margin-left:auto}

/* ---------- アプリの画面 ---------- */
main.page{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
@media (max-width:639px){main.page{padding:12px 12px 80px}}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs button .count{height:18px;min-width:18px;font-size:11px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.toolbar .search{margin:0;flex:1 1 220px;max-width:380px}
.toolbar .search input{height:38px}
.toolbar .search svg{top:9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.panel>h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel>h3 .sp{flex:1}
.panel.flat{box-shadow:none}
.panel.pad0{padding:0}
.panel.soft{background:var(--bg-soft);box-shadow:none}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.c21{grid-template-columns:2fr 1fr}
@media (max-width:899px){.cols,.cols.c3,.cols.c21{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi.warn{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--t-orange-bg)}
.kpi.ng{border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:var(--t-red-bg)}
.empty{color:var(--muted);font-size:14px;padding:30px 12px;text-align:center}
.empty .btn{margin-top:10px}
.loading{display:flex;justify-content:center;padding:30px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.progress>div{height:100%;background:var(--brand);border-radius:99px}
.progress.ok>div{background:var(--ok)}
.sticky-foot{position:sticky;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:5}

/* ---------- 表 ---------- */
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg-softer);position:sticky;top:0;z-index:1}
table.list th.sortable{cursor:pointer;user-select:none}
table.list th.sortable:hover{color:var(--text)}
table.list td.nw,table.list th.nw{white-space:nowrap}
table.list td.r,table.list th.r{text-align:right;font-variant-numeric:tabular-nums}
table.list td.c,table.list th.c{text-align:center}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--bg-soft)}
table.list tr.dim td{opacity:.55}
table.list tr.warn td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
table.list tr.ng td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
table.list tfoot td{font-weight:700;border-top:2px solid var(--line-strong)}
table.list.compact th,table.list.compact td{padding:6px 6px}
table.list input,table.list select{height:34px;border-radius:8px;padding:0 8px;font-size:14px}
table.edit td{padding:4px}
.rowact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cardlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.rcard:hover{border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.rcard .main{flex:1;min-width:0}
.rcard .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.rcard .s{font-size:12.5px;color:var(--muted)}

/* ---------- ダイアログ ---------- */
dialog.dlg{border:0;border-radius:20px;padding:0;max-width:min(760px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--text);box-shadow:var(--shadow-hover);max-height:calc(100dvh - 24px)}
dialog.dlg::backdrop{background:rgba(10,15,30,.45)}
dialog.dlg.sm{max-width:min(440px,calc(100vw - 24px))}
dialog.dlg.lg{max-width:min(1040px,calc(100vw - 24px))}
dialog.dlg.xl{max-width:min(1240px,calc(100vw - 24px))}
dialog.dlg>.dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.dlg-h h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-b{padding:16px 18px;overflow:auto;flex:1 1 auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;flex:none}
.dlg-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:639px){
  dialog.dlg,dialog.dlg.sm,dialog.dlg.lg,dialog.dlg.xl{max-width:100vw;width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  dialog.dlg.sm{height:auto;max-height:90dvh;border-radius:18px 18px 0 0;margin:auto 0 0}
  dialog.dlg>.dlg-in{max-height:100dvh;height:100%}
  .dlg-b{padding:14px}
}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:1000;box-shadow:var(--shadow-hover);max-width:calc(100vw - 32px);text-align:center}
.toast.err{background:#B42318}
.toast.ok{background:#1E7B34}

/* ---------- タスカー・ガント ---------- */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gantt table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.gantt th,.gantt td{border-bottom:1px solid var(--line);padding:0;height:30px;white-space:nowrap}
.gantt th{position:sticky;top:0;background:var(--bg-softer);z-index:2;font-weight:600;color:var(--muted);font-size:11px}
.gantt .gname{position:sticky;left:0;background:var(--surface);z-index:1;padding:0 8px;min-width:220px;max-width:260px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.gantt th.gname{z-index:3;background:var(--bg-softer)}
.gantt .gday{width:26px;min-width:26px;text-align:center;border-left:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.gantt .gday.we{background:color-mix(in srgb,var(--bg-soft) 70%,transparent)}
.gantt .gday.today{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.gantt .bar{height:16px;background:var(--brand);margin:0 -1px;position:relative}
.gantt .bar.bs{border-radius:5px 0 0 5px;margin-left:2px}.gantt .bar.be{border-radius:0 5px 5px 0;margin-right:2px}.gantt .bar.bs.be{border-radius:5px}
.gantt .bar.child{background:color-mix(in srgb,var(--brand) 60%,#fff)}
.gantt .bar.done{background:var(--ok)}
.gantt .bar.late{background:var(--danger)}
.gantt .bar .pg{position:absolute;inset:0;background:rgba(255,255,255,.35);border-radius:5px}
.tree-child td:first-child{padding-left:26px}
.countdown{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#2a6ae0);color:#fff;margin:0 0 14px}
.countdown .d{font-size:34px;font-weight:800;line-height:1}
.countdown .g{font-size:14px;opacity:.95}
.countdown .btn{margin-left:auto;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}

/* ---------- 入退室・在室ボード ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;font-size:13.5px}
.mcard.in{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:var(--t-green-bg)}
.mcard.stale{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--t-orange-bg)}
.mcard .nm{font-weight:700}

/* ---------- 機材 ---------- */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.eq .code{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--brand-ink)}
.eq .nm{font-weight:700;line-height:1.35}
.eq.inuse{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(180deg,var(--t-orange-bg),var(--surface) 70%)}
.eq.maint{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.eq .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- キオスク ---------- */
.kiosk{min-height:100vh;background:var(--bg-soft);display:flex;flex-direction:column}
.kiosk .kh{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.kiosk .kh .clock{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kiosk .kb{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.kiosk .kbox{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:880px;text-align:center}
.kiosk .kbig{font-size:28px;font-weight:800;margin:6px 0}
.kiosk .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
.kiosk .kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;cursor:pointer;padding:10px}
.kiosk .kbtn:hover{border-color:var(--brand)}
.kiosk .kbtn.go{background:var(--brand);border-color:var(--brand);color:#fff}
.kiosk .kbtn.stop{background:var(--accent);border-color:var(--accent);color:#fff}
.kiosk .kbtn.in{background:var(--ok);border-color:var(--ok);color:#fff}
.kiosk .kbtn.busy{opacity:.55}
.kiosk .kbtn small{font-weight:500;font-size:13px;opacity:.9}

/* ---------- スキャナー ---------- */
.scanbox{position:relative;width:100%;max-width:560px;margin:0 auto;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.scanbox .frame.wide{inset:30% 6%}
.scanbox .hit{position:absolute;inset:0;background:rgba(30,142,62,.35);opacity:0;transition:opacity .15s}
.scanbox .hit.on{opacity:1}
.scanbox .scanmsg{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.scanbox.mirror video{transform:scaleX(-1)}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:899px){.pos{grid-template-columns:1fr}}
.pos .cart table.list td{padding:8px 6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;border:0;background:var(--bg-soft);cursor:pointer;font-size:18px}
.qty input{width:52px;height:36px;border:0;border-radius:0;text-align:center;padding:0}
.pos .total{font-size:40px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.pos .total small{font-size:15px;color:var(--muted);font-weight:600}
.pos .paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos .keypad button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
.pos .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pos .prod{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:72px;display:flex;flex-direction:column;gap:2px}
.pos .prod:hover{border-color:var(--brand)}
.pos .prod b{font-size:13.5px;line-height:1.3}
.pos .prod span{font-size:13px;color:var(--muted)}
.pos .prod.out{opacity:.5}
.custdisp{position:fixed;inset:0;background:#0b1a3a;color:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.custdisp .amt{font-size:min(16vw,120px);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- カレンダー ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .dow{background:var(--bg-softer);font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.cal .dow.sun,.cal .day.sun .dn{color:var(--danger)}
.cal .dow.sat,.cal .day.sat .dn{color:var(--brand-ink)}
.cal .day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;font-size:12px;cursor:pointer;overflow:hidden}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--bg-softer);color:var(--muted)}
.cal .day.today{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.cal .day .dn{font-weight:700;font-size:12.5px}
.ev{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11.5px;background:var(--t-blue-bg);color:var(--t-blue-fg)}
.ev.k-teirei{background:var(--t-orange-bg);color:var(--t-orange-fg)}.ev.k-soukai{background:var(--t-red-bg);color:var(--t-red-fg)}.ev.k-katsudo{background:var(--t-green-bg);color:var(--t-green-fg)}.ev.k-event{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.cal .ev{display:block;border-radius:5px;padding:1px 5px;margin:2px 0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--t-blue-bg);color:var(--t-blue-fg)}
.cal .ev.k-teirei{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.cal .ev.k-soukai{background:var(--t-red-bg);color:var(--t-red-fg)}
.cal .ev.k-katsudo{background:var(--t-green-bg);color:var(--t-green-fg)}
.cal .ev.k-event{background:var(--t-violet-bg);color:var(--t-violet-fg)}
@media (max-width:639px){.cal .day{min-height:64px;padding:2px}.cal .ev{font-size:10px;padding:0 3px}}
.poll{border-collapse:collapse;font-size:13px}
.poll th,.poll td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.poll th.nm,.poll td.nm{text-align:left;position:sticky;left:0;background:var(--surface)}
.poll .best{background:var(--t-green-bg)}
.poll .mk-o{color:var(--ok);font-weight:800}
.poll .mk-t{color:var(--warn);font-weight:800}
.poll .mk-x{color:var(--danger);font-weight:800}
.mark3{display:inline-flex;gap:4px}
.mark3 button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer}
.mark3 button.on.o{background:var(--ok);color:#fff;border-color:var(--ok)}
.mark3 button.on.t{background:var(--accent);color:#fff;border-color:var(--accent)}
.mark3 button.on.x{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ---------- チャット ---------- */
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100dvh - 57px);max-width:1440px;margin:0 auto}
.chat .side{border-right:1px solid var(--line);overflow:auto;background:var(--bg-softer);padding:10px}
.chat .side h4{font-size:12px;color:var(--muted);margin:12px 6px 4px;display:flex;align-items:center;gap:6px}
.chat .side h4 .btn{margin-left:auto}
.chat .ch{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-size:14px;color:var(--text)}
.chat .ch:hover{background:var(--bg-soft)}
.chat .ch.on{background:var(--t-blue-bg);color:var(--t-blue-fg);font-weight:700}
.chat .ch.unread{font-weight:800}
.chat .ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat .ph h2{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.chat .day-sep{text-align:center;font-size:12px;color:var(--muted);margin:12px 0 6px}
.chat .day-sep span{background:var(--bg-soft);padding:2px 10px;border-radius:999px}
.chat .m{display:flex;gap:10px;padding:4px 6px;border-radius:10px;position:relative}
.chat .m:hover{background:var(--bg-softer)}
.chat .m.cont{padding-top:0}
.chat .m.cont .avatar{visibility:hidden;height:0}
.chat .m .body{flex:1;min-width:0}
.chat .m .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.chat .m .meta b{color:var(--text);font-size:13.5px}
.chat .m .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}

.linkgroup h3{font-size:13px;color:var(--muted);margin:16px 0 6px}

    return F.query(ref(path), ...cs);
  }
  return {
    kind: 'fs',
    newId: (path) => F.doc(F.collection(db, ...segs(path))).id,
    watchQuery(path, q, cb, onErr) {
      return F.onSnapshot(buildQuery(path, q), (s) => cb(s.docs.map(snapRow)), (e) => { console.error('watch', path, e); if (onErr) onErr(e); });
    },
    watchDoc(path, cb, onErr) {
      return F.onSnapshot(ref(path), (s) => cb(s.exists() ? snapRow(s) : null), (e) => { console.error('watchDoc', path, e); if (onErr) onErr(e); });
    },
    async get(path) { const s = await F.getDoc(ref(path)); return s.exists() ? snapRow(s) : null; },
    async list(path, q) { const s = await F.getDocs(buildQuery(path, q)); return s.docs.map(snapRow); },
    commit(ops) {
      if (ops.length === 1) {
        const o = ops[0], r = ref(o.path);
        if (o.op === 'delete') return F.deleteDoc(r);
        if (o.op === 'update') return F.updateDoc(r, toFs(stripMeta(o.data)));
        return F.setDoc(r, toFs(stripMeta(o.data)), o.merge ? { merge: true } : {});
      }
      const b = F.writeBatch(db);
      ops.forEach((o) => {
        const r = ref(o.path);
        if (o.op === 'delete') b.delete(r);
        else if (o.op === 'update') b.update(r, toFs(stripMeta(o.data)));
        else b.set(r, toFs(stripMeta(o.data)), o.merge ? { merge: true } : {});

      return b.commit();
    },
    tx(fn) {
      return F.runTransaction(db, async (tr) => fn({
        get: async (path) => { const s = await tr.get(ref(path)); return s.exists() ? snapRow(s) : null; },
        set: (path, data, opt = {}) => { tr.set(ref(path), toFs(stripMeta(data)), opt.merge ? { merge: true } : {}); },
        update: (path, data) => { tr.update(ref(path), toFs(stripMeta(data))); },
        delete: (path) => { tr.delete(ref(path)); }
      }));
    }
  };
}

/* ==========================================================================
   共通の窓口
   ========================================================================== */
const DB = {
  engine: null,
  mode: 'none',
  use(engine, mode) { this.engine = engine; this.mode = mode; Live.reset(); },
  now: SENT.now, inc: SENT.inc, union: SENT.union, remove: SENT.remove, delField: SENT.del,
  newId(colPath) { return this.engine.newId(colPath); },
  watch(path, q, cb, onErr) {
    return this.engine.watchQuery(path, q, cb, onErr || ((e) => toast('読み込めませんでした：' + errText(e), 'err')));
  },
  watchDoc(path, cb, onErr) {
    return this.engine.watchDoc(path, cb, onErr || ((e) => { if (e && e.code === 'permission-denied') cb(null); else toast('読み込めませんでした：' + errText(e), 'err'); }));
  },
  get(path) { return this.engine.get(path); },
  list(path, q) { return this.engine.list(path, q); },
  /** 新しく追加して、IDを返す */
  async add(colPath, data, opt = {}) {
    const id = this.engine.newId(colPath);
    await tracked(this.engine.commit([{ op: 'set', path: colPath + '/' + id, data }]), opt.wait);
    return id;
  },
  set(path, data, opt = {}) { return tracked(this.engine.commit([{ op: 'set', path, data, merge: !!opt.merge }]), opt.wait); },
  update(path, data, opt = {}) { return tracked(this.engine.commit([{ op: 'update', path, data }]), opt.wait); },
  del(path, opt = {}) { return tracked(this.engine.commit([{ op: 'delete', path }]), opt.wait); },
  /** まとめて書く（全部成功か全部失敗）。ops: [{op:'set'|'update'|'delete'|'add', path, data, merge}] → addのIDを返す */
  async batch(ops, opt = {}) {
    const ids = [];
    const real = ops.filter(Boolean).map((o) => {
      if (o.op === 'add') { const id = this.engine.newId(o.path); ids.push(id); return { op: 'set', path: o.path + '/' + id, data: o.data }; }
      return o;
    });
    if (!real.length) return ids;
    for (let i = 0; i < real.length; i += 450) await tracked(this.engine.commit(real.slice(i, i + 450)), opt.wait);
    return ids;
  },
  tx(fn) { return tracked(this.engine.tx(fn), true); },
  /** 連番を1つ進めて返す（見積番号・伝票番号など）。同時に押してもぶつからない */
  async next(key) {
    return this.tx(async (t) => {
      const cur = await t.get('counters/' + key);
      const n = ((cur && cur.n) || 0) + 1;
      t.set('counters/' + key, { n, at: SENT.now() });
      return n;
    });
  }
};

/* ---------- 共有の見張り（会員の名前・機材・設定など、何度も使う小さな一覧） ---------- */
const Live = {
  stores: new Map(),
  reset() { this.stores.forEach((s) => { try { s.unsub && s.unsub(); } catch { /* なし */ } }); this.stores.clear(); },
  /** 一覧をずっと見張る。on(cb) で変わるたびに呼ばれる */
  list(path, q) {
    const key = path + '|' + JSON.stringify(q || {});
    let s = this.stores.get(key);
    if (!s) {
      s = { rows: [], ready: false, cbs: new Set(), unsub: null, error: null };
      s.unsub = DB.watch(path, q, (rows) => { s.rows = rows; s.ready = true; s.cbs.forEach((f) => { try { f(rows); } catch (e) { console.error(e); } }); },
        (e) => { s.error = e; s.ready = true; s.cbs.forEach((f) => { try { f(s.rows); } catch { /* なし */ } }); });
      this.stores.set(key, s);
    }
    return {
      get rows() { return s.rows; },
      get ready() { return s.ready; },
      on(cb) { s.cbs.add(cb); if (s.ready) setTimeout(() => cb(s.rows), 0); return () => s.cbs.delete(cb); },
      once() { return s.ready ? Promise.resolve(s.rows) : new Promise((res) => { const off = this.on((r) => { off(); res(r); }); }); }
    };
  },
  doc(path) {
    const key = 'doc|' + path;
    let s = this.stores.get(key);
    if (!s) {
      s = { data: null, ready: false, cbs: new Set(), unsub: null };
      s.unsub = DB.watchDoc(path, (d) => { s.data = d; s.ready = true; s.cbs.forEach((f) => { try { f(d); } catch (e) { console.error(e); } }); }, () => { s.ready = true; s.cbs.forEach((f) => f(s.data)); });
      this.stores.set(key, s);
    }
    return {
      get data() { return s.data; },
      get ready() { return s.ready; },
      on(cb) { s.cbs.add(cb); if (s.ready) setTimeout(() => cb(s.data), 0); return () => s.cbs.delete(cb); },
      once() { return s.ready ? Promise.resolve(s.data) : new Promise((res) => { const off = this.on((d) => { off(); res(d); }); }); }
    };
  }
};

   fields: [{ k, label, type, req, opts, w(1-6), ph, help, min, max, step, unit, show(v), def, ro, rows, max, inputmode,
              scan: { title, hint, formats, value(text, parsed) → 入れる値（空なら読みなおし）, bad, after(v) } … 文字の欄の横にカメラのボタン }]
   type: text email tel url number yen date time datetime month textarea select radio check checks member members static custom
   ========================================================================== */
function Form(fields, values = {}, o = {}) {
  const el = h('div.form');
  const inputs = {};       // k → { field, get(), set(v), wrap }
  const listeners = [];
  const optsOf = (f) => { const v = typeof f.opts === 'function' ? f.opts(api.values()) : (f.opts || []); return v.map((x) => (Array.isArray(x) ? x : [x, x])); };
  const fire = () => { refreshShow(); listeners.forEach((fn) => { try { fn(api.values()); } catch (e) { console.error(e); } }); };

  function build(f) {
    if (f.type === 'section') { el.appendChild(h('h4', f.label)); return; }
    const id = 'f_' + Math.random().toString(36).slice(2, 9);
    const init = values[f.k] !== undefined ? values[f.k] : (typeof f.def === 'function' ? f.def() : f.def);
    let ctl, get, set;
    const common = { id, disabled: !!f.ro, placeholder: f.ph || null };
    switch (f.type) {
      case 'textarea':
        ctl = h('textarea', { ...common, rows: f.rows || 3, maxlength: f.max || 4000 });
        get = () => ctl.value.trim(); set = (v) => { ctl.value = v ?? ''; };
        break;
      case 'number': case 'yen': {
        const inp = h('input', { ...common, type: 'text', inputmode: 'decimal', maxlength: 14, style: { textAlign: 'right' } });
        ctl = f.unit || f.type === 'yen' ? h('div.inp-unit', f.type === 'yen' ? h('span', '¥') : null, inp, f.unit ? h('span', f.unit) : null) : inp;
        get = () => num(inp.value); set = (v) => { inp.value = v === null || v === undefined ? '' : String(v); };
        ctl._focus = inp; break;
      }
      case 'date': case 'time': case 'month':
        ctl = h('input', { ...common, type: f.type, min: f.min || null, max: f.max || null });
        get = () => ctl.value; set = (v) => { ctl.value = f.type === 'date' && v ? ymd(v) : (v || ''); };
        break;
      case 'datetime':
        ctl = h('input', { ...common, type: 'datetime-local' });
        get = () => (ctl.value ? toDate(ctl.value) : null); set = (v) => { ctl.value = v ? dtLocal(v) : ''; };
        break;
      case 'select': {
        ctl = h('select', common);
        const fill = () => {
          const cur = ctl.value;
          mount(ctl, f.empty !== false ? h('option', { value: '' }, f.emptyLabel || '（選ぶ）') : null, optsOf(f).map(([v, l]) => h('option', { value: v }, l)));
          if (cur) ctl.value = cur;
        };
        fill(); ctl._refill = fill;
        get = () => ctl.value; set = (v) => { if (v !== undefined && v !== null && v !== '' && !optsOf(f).some(([x]) => String(x) === String(v))) ctl.appendChild(h('option', { value: v }, String(v))); ctl.value = v ?? ''; };
        break;
      }
      case 'member': {
        ctl = h('select', common);
        const fill = () => { const cur = ctl.value; mount(ctl, h('option', { value: '' }, f.emptyLabel || '（選ぶ）'), Dir.active().map((m) => h('option', { value: m.id }, m.name))); if (cur) ctl.value = cur; };
        fill(); ctl._refill = fill;
        get = () => ctl.value; set = (v) => { if (v && !Dir.byId(v)) ctl.appendChild(h('option', { value: v }, Dir.name(v) || v)); ctl.value = v || ''; };
        break;
      }
      case 'radio': case 'checks': case 'members': {
        const multi = f.type !== 'radio';
        ctl = h('div.chips', { id, role: multi ? 'group' : 'radiogroup' });
        let cur = multi ? [] : '';
        const opts = () => (f.type === 'members' ? Dir.active().map((m) => [m.id, m.name]) : optsOf(f));
        const draw = () => mount(ctl, opts().map(([v, l]) => {
          const on = multi ? cur.includes(v) : cur === v;
          const b = h('button.chip' + (on ? '.on' : '') + (f.chipCls ? '.' + f.chipCls(v) : ''), { type: 'button', disabled: !!f.ro, 'aria-pressed': on ? 'true' : 'false' }, l);
          b.addEventListener('click', () => { if (multi) cur = on ? cur.filter((x) => x !== v) : [...cur, v]; else cur = on && !f.req ? '' : v; draw(); fire(); });
          return b;
        }));
        get = () => (multi ? cur.slice() : cur); set = (v) => { cur = multi ? (Array.isArray(v) ? v.slice() : []) : (v ?? ''); draw(); };
        ctl._refill = draw;
        break;
      }
      case 'check': {
        const cb = h('input', { type: 'checkbox', id, disabled: !!f.ro });
        ctl = h('label.check', { style: { margin: '4px 0 0' } }, cb, h('span', f.text || f.label));
        get = () => cb.checked; set = (v) => { cb.checked = !!v; };
        cb.addEventListener('change', fire);
        break;
      }
      case 'static':
        ctl = h('div', { style: { padding: '8px 0' } });
        get = () => values[f.k]; set = (v) => { mount(ctl, f.render ? f.render(v) : (v ?? '')); };
        break;
      case 'custom': {
        const c = f.render(init, fire, api);
        ctl = c.el || c;
        get = () => (c.get ? c.get() : undefined); set = (v) => { if (c.set) c.set(v); };
        break;
      }
      default: {
        const inp = h('input', { ...common, type: f.type === 'email' || f.type === 'tel' || f.type === 'url' ? f.type : 'text', maxlength: f.max || 200, inputmode: f.inputmode || (f.type === 'tel' ? 'tel' : null), autocomplete: f.ac || 'off', list: f.list ? id + '_dl' : null });
        ctl = inp;
        if (f.list) { const dl = h('datalist', { id: id + '_dl' }, (typeof f.list === 'function' ? f.list() : f.list).map((x) => h('option', { value: x }))); ctl = h('div', inp, dl); ctl._focus = inp; }
        get = () => inp.value.trim(); set = (v) => { inp.value = v ?? ''; };
      }
    }
    if (f.scan && !f.ro && ctl.tagName !== 'TEXTAREA') {   // カメラで読んで入れる（バーコード・QR）
      const inner = ctl._focus || ctl;
      const cam = h('button.btn.icon', { type: 'button', 'aria-label': (f.label || '') + 'をカメラで読む', title: 'カメラで読む' }, icon('camera'));
      cam.addEventListener('click', () => Scanner.open({
        title: f.scan.title || 'カメラで読む', hint: f.scan.hint, formats: f.scan.formats || 'all', continuous: true, cooldown: 1200,
        onCode: async (text, p) => {
          const v = f.scan.value ? f.scan.value(String(text || '').trim(), p) : String(text || '').trim();
          if (!v) { beep(false); toast(f.scan.bad || 'このコードは使えません。もう一度読んでください', 'err', 4000); return true; }
          set(v); fire(); beep(true);
          if (f.scan.after) setTimeout(() => f.scan.after(v), 0);
          return false;
        }
      }));
      const box = h('div.inp-scan', ctl, cam);
      box._focus = inner;
      ctl = box;
    }
    if (f.type !== 'check' && f.type !== 'radio' && f.type !== 'checks' && f.type !== 'members' && f.type !== 'custom') {
      (ctl._focus || ctl).addEventListener?.('input', fire);
      (ctl._focus || ctl).addEventListener?.('change', fire);
      if (o.onEnter && f.type !== 'textarea') (ctl._focus || ctl).addEventListener?.('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT') { e.preventDefault(); o.onEnter(); } });
    }
    const wrap = h('div.field' + (f.w && f.w < 6 ? '.w' + f.w : ''),
      f.type === 'check' && !f.text ? null : h('label', { for: id, class: 'lb', style: { display: 'block', fontSize: '13px', color: 'var(--muted)', marginBottom: '4px' } }, f.label || '', f.req ? h('span.req', '*') : null),
      ctl,
      f.help ? h('div.help', f.help) : null);
    el.appendChild(wrap);
    inputs[f.k] = { field: f, get, set, wrap, ctl };
    set(init);
  }
  function refreshShow() {
    const v = api.values();
    Object.values(inputs).forEach((x) => { if (x.field.show) x.wrap.hidden = !x.field.show(v); });
  }
  const api = {
    el,
    values() { const out = { ...(o.keep ? values : {}) }; Object.entries(inputs).forEach(([k, x]) => { out[k] = x.get(); }); return out; },
    get(k) { return inputs[k] ? inputs[k].get() : undefined; },
    set(k, v) { if (inputs[k]) { inputs[k].set(v); fire(); } },
    refill(k) { const x = inputs[k]; if (x && x.ctl._refill) x.ctl._refill(); },
    on(fn) { listeners.push(fn); return api; },
    field(k) { return inputs[k]; },
    validate() {
      const v = api.values();
      for (const [k, x] of Object.entries(inputs)) {
        const f = x.field;
        if (x.wrap.hidden) continue;
        const val = v[k];
        const empty = val === null || val === undefined || val === '' || (Array.isArray(val) && !val.length) || val === false && f.type === 'check' && f.req;
        if (f.req && empty) return `「${f.label}」を入れてください`;
        if (!empty && (f.type === 'number' || f.type === 'yen')) {
          if (typeof val !== 'number') return `「${f.label}」は数字で入れてください`;
          if (f.min !== undefined && val < f.min) return `「${f.label}」は ${f.min} 以上にしてください`;
          if (f.max !== undefined && val > f.max) return `「${f.label}」は ${f.max} 以下にしてください`;
        }
        if (!empty && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return `「${f.label}」の形が正しくありません`;
        if (!empty && f.type === 'url' && (!/^https:\/\//.test(val) || !safeUrl(val))) return `「${f.label}」は https:// から始まる形で入れてください`;
        if (!empty && f.pattern && !f.pattern.test(val)) return f.patternMsg || `「${f.label}」の形が正しくありません`;
        if (f.check) { const m = f.check(val, v); if (m) return m; }
      }
      return '';
    },
    focus() { const first = Object.values(inputs).find((x) => !x.wrap.hidden && !x.field.ro); if (first) { const c = first.ctl._focus || first.ctl; if (c.focus) c.focus(); } }
  };
  fields.filter(Boolean).forEach(build);
  refreshShow();
  return api;
}

/**
 * フォームのダイアログ：formDialog({ title, fields, values, ok:'保存', onSubmit: async (v) => {...}, extraFoot, size, danger:{label,onClick} })
 * onSubmit で例外を投げるとエラー表示。成功したら閉じる（false を返すと閉じない）
 */
function formDialog(o) {
  const msg = h('div');
  const f = Form(o.fields, o.values || {}, { onEnter: o.enterSubmit === false ? null : () => okBtn.click(), keep: o.keep });
  const okBtn = h('button.btn.primary', { type: 'button' }, o.ok || '保存');
  const cancel = h('button.btn', { type: 'button' }, o.cancelLabel || 'キャンセル');
  const left = h('div.left');
  if (o.danger) left.appendChild(btn(o.danger.label, async (e, b) => { const r = await o.danger.onClick(f.values(), d, b); if (r !== false) d.close(); }, 'danger', o.danger.icon || 'trash'));
  (o.extraFoot || []).forEach((x) => left.appendChild(typeof x === 'function' ? x(f, d) : x));
  const d = openDialog({ title: o.title, size: o.size || 'md', body: h('div', o.intro || null, f.el, o.after ? o.after(f) : null, msg), foot: [left, cancel, okBtn], onClose: o.onClose });
  cancel.addEventListener('click', () => d.close());
  okBtn.addEventListener('click', async () => {
    const err = f.validate();
    if (err) { msgBox(msg, err); return; }
    msgBox(msg, '');
    try {
      const r = await busy(okBtn, () => o.onSubmit(f.values(), f, d));
      if (r !== false) { d.close(r); if (o.okMsg) toast(o.okMsg, 'ok'); }
    } catch (e) { if (!e.userMessage) console.error(e); msgBox(msg, errText(e)); }
  });
  softFocus(() => f.focus(), d.el, 40);
  d.form = f;
  return d;
}

/* ---- 06_print.js ---- */
/* ==========================================================================
   印刷（A4の帳票・レシート・ラベル・IDカード）
   ・#print-root に中身を入れて、印刷の時だけそこを表示する方式（スマホのSafariでも動く）
   ・用紙：A4（縦）／A4L（横）／R58・R80（感熱レシート：長さは中身に合わせる）／LABEL（ラベル1枚ずつ）
   ========================================================================== */
const Print = {
  sizes: {
    A4: { css: '@page{size:A4 portrait;margin:0}', w: 210 },
    A4L: { css: '@page{size:A4 landscape;margin:0}', w: 297 },
    R58: { w: 58, receipt: true },
    R80: { w: 80, receipt: true }
  },
  /** プレビューを出してから印刷。html は自分で作った（esc済みの）HTML文字列 */
  preview(o) {
    const size = o.size || 'A4';
    const sz = this.sizes[size] || { w: o.w || 210 };
    const stage = h('div', { style: { background: '#e9edf3', borderRadius: '12px', padding: '12px', overflow: 'auto', maxHeight: '70vh' } });
    const inner = h('div', { html: o.html, style: { transformOrigin: 'top left', width: (o.w || sz.w) + 'mm', background: '#fff', boxShadow: '0 2px 10px rgba(0,0,0,.15)' } });
    stage.appendChild(inner);
    const fit = () => {
      const avail = stage.clientWidth - 24;
      const wpx = inner.offsetWidth;
      const s = Math.min(1, avail / wpx);
      inner.style.transform = `scale(${s})`;
      inner.style.marginBottom = `-${inner.offsetHeight * (1 - s)}px`;
      inner.style.marginRight = `-${wpx * (1 - s)}px`;
    };
    const printBtn = btn('印刷する', () => this.now(o.html, size, o), 'primary', 'printer');
    const d = openDialog({
      title: o.title || '印刷', size: 'lg',
      body: h('div', o.note ? h('p.small.muted.mt0', o.note) : null, stage, h('p.xs.muted', 'スマホは「印刷」→ 共有メニューの「プリント」、PDFにしたいときは印刷画面で「PDFに保存」を選びます。')),
      foot: [o.extraFoot || null, btn('閉じる', () => d.close()), printBtn]
    });
    setTimeout(fit, 30);
    const ro = new ResizeObserver(() => fit()); ro.observe(stage); d.track(() => ro.disconnect());
    return d;
  },
  /** すぐ印刷する */
  now(html, size = 'A4', o = {}) {
    const root = $('#print-root');
    root.innerHTML = html;
    let css = (this.sizes[size] && this.sizes[size].css) || '';
    if (o.pageCss) css = o.pageCss;
    const sz = this.sizes[size];
    if (sz && sz.receipt) {
      root.style.display = 'block'; root.style.position = 'absolute'; root.style.left = '-9999px'; root.style.top = '0';
      const hmm = Math.ceil(root.scrollHeight * 25.4 / 96) + 8;
      root.style.cssText = '';
      css = `@page{size:${sz.w}mm ${Math.max(60, hmm)}mm;margin:0}`;
    }
    let st = $('#print-page-style');
    if (!st) { st = h('style#print-page-style'); document.head.appendChild(st); }
    st.textContent = css;
    // body.printing は印刷の時だけ効く（画面の見た目は変わらない）。スマホは印刷が終わる前に戻ってくるので、片付けは afterprint の時だけ
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  }
};

/* ---------- 帳票を作る小さな道具 ---------- */
const P = {
  box: (on) => `<span class="box${on ? ' on' : ''}"></span>`,
  /** □選択肢 を並べる（選ばれたものに✓） */
  choices: (list, sel) => list.map((x) => `${P.box(Array.isArray(sel) ? sel.includes(x) : sel === x)}${esc(x)}`).join('　'),
  orgFooter() {
    const o = Org.get();
    return `${esc(o.name)}　〒${esc(o.zip)} ${esc(o.address)}　TEL: ${esc(o.tel)}<br>${esc(o.email)}　${esc(o.url)}　${o.hours ? '営業時間: ' + esc(o.hours) : ''}`;
  },
  /** A4の1ページ */
  page(inner, o = {}) {
    return `<div class="pdoc${o.gothic ? ' gothic' : ''}"><div class="ppage ${o.landscape ? 'a4l' : 'a4'}">${o.tag ? `<div class="ptag">${esc(o.tag)}</div>` : ''}${inner}${o.noFooter ? '' : `<div class="pfoot">${P.orgFooter()}</div>`}</div></div>`;
  },
  issuer(staffName) {
    const o = Org.get();
    return `<div class="issuer"><b style="font-size:11pt">${esc(o.name)}</b><br>〒${esc(o.zip)} ${esc(o.address)}<br>TEL: ${esc(o.tel)}　E-mail: ${esc(o.email)}<br>担当：${esc(staffName || '')}<span class="seal">印</span></div>`;
  },
  dash: (v) => (v === null || v === undefined || v === '' ? '' : esc(v)),
  yen: (n) => (n === null || n === undefined || n === '' ? '' : Math.round(n).toLocaleString('ja-JP')),
  emptyRows(n, cols) { return Array.from({ length: Math.max(0, n) }, () => `<tr>${'<td>&nbsp;</td>'.repeat(cols)}</tr>`).join(''); }
};

/* ---- 07_codes.js ---- */
/* ==========================================================================
   バーコード（Code128）・QRコードを作る
   ・Code128：自前で作る（在庫ラベル用。品番 P-001 などの英数字・記号OK）
   ・QR：vendor/qrcode.js（qrcode-generator, MIT）を必要な時に読み込む
   ========================================================================== */
const Codes = {
  C128: ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232', '2331112'],
  /** Code128 の値の並び（スタート・データ・チェック・ストップ） */
  code128Values(text) {
    const s = String(text);
    if (!s.length) throw new Error('empty');
    for (const ch of s) { const c = ch.charCodeAt(0); if (c < 32 || c > 126) throw new Error('Code128 で使えない文字があります：' + ch); }
    const vals = [];
    if (/^\d+$/.test(s) && s.length % 2 === 0 && s.length >= 4) {
      vals.push(105);
      for (let i = 0; i < s.length; i += 2) vals.push(parseInt(s.slice(i, i + 2), 10));
    } else {
      vals.push(104);
      for (const ch of s) vals.push(ch.charCodeAt(0) - 32);
    }
    let sumv = vals[0];
    for (let i = 1; i < vals.length; i++) sumv += vals[i] * i;
    vals.push(sumv % 103);
    vals.push(106);
    return vals;
  },
  /** 黒白の幅の並び（黒から始まる） */
  code128Widths(text) { return this.code128Values(text).map((v) => this.C128[v]).join('').split('').map(Number); },
  /** Code128 の SVG（w・h は印刷サイズ、例 '40mm' '12mm'） */
  code128Svg(text, o = {}) {
    const ws = this.code128Widths(text);
    const quiet = o.quiet ?? 10;
    const total = ws.reduce((a, b) => a + b, 0) + quiet * 2;
    let x = quiet, d = '';
    ws.forEach((w, i) => { if (i % 2 === 0) d += `M${x} 0h${w}v1h-${w}z`; x += w; });
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} 1" preserveAspectRatio="none" width="${o.w || total * 0.3 + 'mm'}" height="${o.h || '10mm'}" shape-rendering="crispEdges"><rect width="${total}" height="1" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  },
  /** JAN（EAN-13）のチェック数字が正しいか */
  isEan13(s) {
    if (!/^\d{13}$/.test(s)) return false;
    const d = s.split('').map(Number);
    const c = (10 - (d.slice(0, 12).reduce((a, x, i) => a + x * (i % 2 ? 3 : 1), 0) % 10)) % 10;
    return c === d[12];
  },
  async ready() {
    if (window.qrcode) return;
    await loadScript(CONFIG.VENDOR_PATH + 'qrcode.js');
    if (!window.qrcode) throw new Error('QRの部品を読み込めませんでした');
  },
  /** QRコードの SVG（先に await Codes.ready() しておく） */
  qrSvg(text, o = {}) {
    const qr = window.qrcode(0, o.ecc || 'M');
    qr.addData(String(text));
    qr.make();
    const n = qr.getModuleCount(), m = o.margin ?? 2, size = n + m * 2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${o.size || '24mm'}" height="${o.size || '24mm'}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  },
  /** QRの中身の決まり（ほかのQRと間違えないように頭に印をつける） */
  cardText: (token) => 'MTIC-ID:' + token,
  equipText: (code) => 'MTIC-EQ:' + code,
  parse(text) {
    const s = String(text || '').trim();
    let m;
    if ((m = s.match(/^MTIC-ID:([A-Za-z0-9]{16,64})$/))) return { kind: 'card', token: m[1] };
    if ((m = s.match(/^MTIC-EQ:(.{1,30})$/))) return { kind: 'equip', code: m[1] };
    return { kind: 'code', code: s };
  }
};

/* ---- 08_scanner.js ---- */
/* ==========================================================================
   カメラでQR・バーコードを読む（スマホ・タブレット・PC＋USBカメラ）
   ・ブラウザに読み取り機能（BarcodeDetector）があればそれを使い、なければ ZXing（vendor/zxing.min.js）
   ・USBのバーコードリーダー（キーボードのように文字を打つ機械）もそのまま使える（listenWedge）
   ========================================================================== */
const Scanner = {
  zxReader: null,
  async detectorFor(formats) {
    if ('BarcodeDetector' in window) {
      try {
        const want = formats === 'qr' ? ['qr_code'] : ['qr_code', 'code_128', 'ean_13', 'ean_8', 'code_39', 'upc_a', 'itf'];
        const sup = await window.BarcodeDetector.getSupportedFormats();
        const use = want.filter((f) => sup.includes(f));
        if (use.length && (formats !== 'qr' || use.includes('qr_code')) && (formats === 'qr' || use.includes('code_128'))) {
          const det = new window.BarcodeDetector({ formats: use });
          return { kind: 'native', detect: async (video) => { const r = await det.detect(video); return r.length ? r[0].rawValue : null; } };
        }
      } catch { /* ZXingに切り替え */ }
    }
    await loadScript(CONFIG.VENDOR_PATH + 'zxing.min.js');
    const Z = window.ZXing;
    if (!Z) throw new Error('読み取りの部品を読み込めませんでした');
    const hints = new Map();
    const F = Z.BarcodeFormat;
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, formats === 'qr' ? [F.QR_CODE] : [F.QR_CODE, F.CODE_128, F.EAN_13, F.EAN_8, F.CODE_39, F.UPC_A, F.ITF]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    return {
      kind: 'zxing',
      detect: async (video) => {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return null;
        const s = Math.min(1, 800 / vw);
        canvas.width = Math.round(vw * s); canvas.height = Math.round(vh * s);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          const src = new Z.HTMLCanvasElementLuminanceSource(canvas);
          const r = reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
          return r ? r.getText() : null;
        } catch { return null; } finally { try { reader.reset(); } catch { /* なし */ } }
      }
    };
  },
  async cameras() {
    try { return (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput'); } catch { return []; }
  },
  /**
   * 画面に埋め込めるカメラ読み取り
   * view({ onCode(text, parsed), formats:'qr'|'all', facing:'environment'|'user', cooldown(ms) })
   */
  view(o = {}) {
    const video = h('video', { playsinline: true, muted: true, autoplay: true });
    video.muted = true; video.setAttribute('playsinline', '');
    const hit = h('div.hit');
    const smsg = h('div.scanmsg', 'カメラを準備しています…');
    const box = h('div.scanbox', video, h('div.frame' + (o.formats === 'qr' ? '' : '.wide')), hit, smsg);
    let stream = null, running = false, timer = null, det = null, last = { t: 0, v: '' };
    const seen = new Map();
    const camKey = 'mtic-cam-' + (o.camKey || 'default');
    const api = {
      el: box,
      async start(deviceId) {
        api.stop();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { smsg.textContent = window.isSecureContext ? 'この端末ではカメラが使えません' : 'カメラは https のページでだけ使えます'; throw Object.assign(new Error('no camera'), { code: 'camera-none' }); }
        const saved = deviceId || store.get(camKey);
        const facing = o.facing || 'environment';
        const tries = saved ? [{ deviceId: { exact: saved } }, { facingMode: facing }] : [{ facingMode: facing }, {}];
        let err = null;
        for (const v of tries) {
          try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...v, width: { ideal: 1280 }, height: { ideal: 720 } } }); break; } catch (e) { err = e; }
        }
        if (!stream) {
          smsg.textContent = err && err.name === 'NotAllowedError' ? 'カメラの使用が許可されていません' : 'カメラを開けませんでした';
          throw Object.assign(err || new Error('camera'), { code: err && err.name === 'NotAllowedError' ? 'camera-denied' : 'camera-none' });
        }
        const track = stream.getVideoTracks()[0];
        const st = track.getSettings ? track.getSettings() : {};
        box.classList.toggle('mirror', st.facingMode === 'user' || (!st.facingMode && o.facing === 'user'));
        if (st.deviceId) api.deviceId = st.deviceId;
        video.srcObject = stream;
        try { await video.play(); } catch { /* 自動再生の制限 */ }
        det = det || await Scanner.detectorFor(o.formats || 'all');
        smsg.textContent = o.hint || 'コードを枠の中に入れてください';
        running = true;
        const loop = async () => {
          if (!running) return;
          try {
            const text = await det.detect(video);
            if (text) {
              const now = Date.now();
              const prevSeen = seen.get(text) || 0;
              seen.set(text, now);
              // 同じコードが映り続けている間は数えない（いったん外して、また映したら数える）
              const stillInView = now - prevSeen < 900;
              if (text !== last.v || (!stillInView && now - last.t > (o.cooldown || 2500))) {
                last = { t: now, v: text };
                hit.classList.add('on'); setTimeout(() => hit.classList.remove('on'), 250);
                beep(true);
                const keep = await o.onCode(text, Codes.parse(text));
                if (keep === false) { api.stop(); return; }
              }
            }
          } catch (e) { console.warn(e); }
          timer = setTimeout(loop, det.kind === 'native' ? 120 : 160);
        };
        loop();
      },
      stop() {
        running = false; clearTimeout(timer);
        if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
        video.srcObject = null;
      },
      async switchCamera() {
        const cams = await Scanner.cameras();
        if (cams.length < 2) { toast('切り替えられるカメラがありません'); return; }
        const i = cams.findIndex((c) => c.deviceId === api.deviceId);
        const next = cams[(i + 1) % cams.length];
        store.set(camKey, next.deviceId);
        await api.start(next.deviceId);
        toast('カメラ：' + (next.label || '切り替えました'));
      },
      async torch(on) {
        try { const t = stream && stream.getVideoTracks()[0]; if (t) await t.applyConstraints({ advanced: [{ torch: !!on }] }); return true; } catch { return false; }
      },
      get running() { return running; }
    };
    return api;
  },
  /**
   * 読み取り用のダイアログを開く
   * open({ title, hint, formats, continuous, onCode(text, parsed) → false を返すと閉じる, manual })
   */
  open(o = {}) {
    let d = null;
    const handle = async (text) => {
      const r = await o.onCode(text, Codes.parse(text));
      if (r === false || !o.continuous) { if (d) d.close(); return false; }
      return true;
    };
    const v = this.view({ formats: o.formats, hint: o.hint, facing: o.facing, cooldown: o.cooldown, camKey: o.camKey || 'dlg', onCode: (text) => handle(text) });
    const manual = h('input', { type: 'text', placeholder: '読めないときは、ここにコードを入力して Enter', 'data-scan': '1', autocomplete: 'off' });
    const status = h('div.small.muted.mt8');
    d = openDialog({
      title: o.title || 'コードを読み取る', size: 'md',
      body: h('div', o.intro || null, v.el, o.manual === false ? null : h('div.mt8', manual), status),
      foot: [btn('カメラを切り替え', () => v.switchCamera().catch((e) => toast(errText(e), 'err')), 'sm', 'refresh'), btn('閉じる', () => d.close(), 'sm')],
      onClose: () => v.stop()
    });
    v.start().catch((e) => { status.textContent = errText(e) + '（下の欄に手で入力もできます）'; });
    manual.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter' && !e.isComposing && manual.value.trim()) { e.preventDefault(); const t = manual.value.trim(); manual.value = ''; beep(true); await handle(t); }
    });
    d.view = v;
    return d;
  }
};

/** USBバーコードリーダー（キーボード入力型）：速く打たれた文字＋Enter をコードとして受け取る */
function listenWedge(cb, o = {}) {
  let buf = '', lastT = 0;
  const onKey = (e) => {
    const a = document.activeElement;
    const inField = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
    if (inField && !(a.dataset && a.dataset.scan)) return;
    const now = Date.now();
    if (now - lastT > (o.gap || 60)) buf = '';
    lastT = now;
    if (e.key === 'Enter') {
      if (buf.length >= (o.min || 3)) { e.preventDefault(); const code = buf; buf = ''; cb(code, Codes.parse(code)); }
      buf = '';
      return;
    }
    if (e.key.length === 1) buf += e.key;
  };
  window.addEventListener('keydown', onKey, true);
  return () => window.removeEventListener('keydown', onKey, true);
}

/* ==========================================================================
   サインイン・パスワード（Google連携なしの、このサイト専用アカウント）
   ========================================================================== */
function pwChecks(pw, email) {
  const local = String(email || '').split('@')[0].toLowerCase();
  const hasSym = [...pw].some((c) => FB_SYMBOLS.includes(c));
  return [
    { ok: pw.length >= CONFIG.PASSWORD.minLength, label: `${CONFIG.PASSWORD.minLength}文字以上` },
    { ok: /[A-Z]/.test(pw), label: '大文字（A〜Z）' },
    { ok: /[a-z]/.test(pw), label: '小文字（a〜z）' },
    { ok: /[0-9]/.test(pw), label: '数字（0〜9）' },
    { ok: hasSym, label: '記号（! @ # % & * ? _ など）' },
    { ok: !(local.length >= 3 && pw.toLowerCase().includes(local)), label: 'メールアドレスの一部を入れない' },
    { ok: !/(.)\1\1/.test(pw), label: '同じ文字を3つ以上続けない' }
  ];
}
function pwStrength(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^A-Za-z0-9]/.test(pw)) pool += 30;
  return Math.min(100, Math.round(pw.length * Math.log2(Math.max(pool, 1)) / 1.1));
}
/** 過去の流出データに含まれていないかを確認（パスワード本体は送らない：ハッシュの先頭5文字だけ送る方式） */
async function pwnedCount(pw) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(pw));
  const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
  const res = await fetch('https://api.pwnedpasswords.com/range/' + hex.slice(0, 5), { cache: 'no-store' });
  if (!res.ok) throw new Error('check-failed');
  for (const line of (await res.text()).split('\n')) {
    const [suf, cnt] = line.trim().split(':');
    if (suf === hex.slice(5)) return parseInt(cnt, 10) || 1;
  }
  return 0;
}
/** パスワード入力の部品（新しいパスワード・確認・生成ボタン・規則の表示・使い回し確認） */
function pwWidget(getEmail) {
  const inp = h('input', { type: 'password', autocomplete: 'new-password', 'aria-label': '新しいパスワード' });
  const again = h('input', { type: 'password', autocomplete: 'new-password', 'aria-label': '確認用' });
  const eye = h('button.eye', { type: 'button', 'aria-label': 'パスワードを表示' }, icon('eye'));
  const bar = h('div'), level = h('div.small.muted', '強さ：―'), rules = h('ul.rules');
  const unique = h('input', { type: 'checkbox' });
  const render = () => {
    const pw = inp.value;
    mount(rules, pwChecks(pw, getEmail()).map((c) => h('li', { class: pw ? (c.ok ? 'ok' : 'ng') : null }, c.label)));
    const s = pw ? pwStrength(pw) : 0;
    bar.style.width = s + '%';
    bar.style.background = s < 55 ? 'var(--danger)' : s < 75 ? 'var(--accent)' : 'var(--ok)';
    level.textContent = '強さ：' + (!pw ? '―' : s < 55 ? '弱い' : s < 75 ? 'ふつう' : '強い');
  };
  const setType = (t) => { inp.type = t; again.type = t; mount(eye, icon(t === 'text' ? 'eyeoff' : 'eye')); };
  inp.addEventListener('input', render);
  eye.addEventListener('click', () => setType(inp.type === 'password' ? 'text' : 'password'));
  const el = h('div',
    h('label.field', h('span', '新しいパスワード（このサイト専用）'), h('span.pw-wrap', inp, eye)),
    h('div.meter', bar), level, rules,
    h('label.field', h('span', 'もう一度入力（確認）'), again),
    h('div.row', { style: { margin: '-4px 0 8px' } },
      btn('強いパスワードを作る', () => { const p = genPassword(16); inp.value = p; again.value = p; setType('text'); render(); toast('強いパスワードを作りました。保存してから設定してください'); }, 'sm', 'dice'),
      btn('コピー', async () => { if (inp.value && await copyText(inp.value)) toast('コピーしました（貼り付けたら、クリップボードは別の文字で上書きしておくと安心）'); }, 'sm', 'copy')),
    h('label.check', unique, h('span', 'このパスワードは、メール・Google・SNS・学校など', h('b', 'ほかのサービスでは使っていません'), '（使い回すと、どこかで漏れたときにこのサイトまで入られてしまいます）')),
    h('div.tip', 'ブラウザのパスワード保存か、パスワード管理アプリに保存してください。紙やメモ帳アプリには書かないでください。', h('br'), 'このサイトはパスワードを保存しません（Firebaseが元に戻せない形で保管します。管理者にも見えません）。'));
  render();
  return {
    el,
    value: () => inp.value,
    async validate() {
      const pw = inp.value;
      const bad = pwChecks(pw, getEmail()).filter((c) => !c.ok);
      if (bad.length) return { ok: false, msg: '条件を満たしていません：' + bad.map((b) => b.label).join('、') };
      if (pw !== again.value) return { ok: false, msg: '確認用のパスワードが一致しません' };
      if (!unique.checked) return { ok: false, msg: '「ほかのサービスでは使っていません」にチェックしてください（使っている場合は別のパスワードにしてください）' };
      if (CONFIG.PASSWORD.checkBreached) {
        try {
          const n = await pwnedCount(pw);
          if (n > 0) return { ok: false, msg: `このパスワードは過去に流出したデータに含まれています（${n.toLocaleString()}回）。別のパスワードにしてください` };
        } catch { return { ok: true, warn: '流出チェックはネットワークの都合でできませんでした' }; }
      }
      return { ok: true };
    }
  };
}
