async function loadFirebase() {
  const [appM, A, F] = await Promise.all([
    import(FIREBASE_SDK + 'firebase-app.js'),
    import(FIREBASE_SDK + 'firebase-auth.js'),
    import(FIREBASE_SDK + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(CONFIG.FIREBASE);
  const keep = KIOSK_KEEP;
  if (!KIOSK_DEVICE) await forgetLocalTraces();     // キオスクの端末では、キオスクのサインインを消さない
  const auth = A.initializeAuth(app, { persistence: keep ? [A.indexedDBLocalPersistence, A.browserLocalPersistence] : [A.browserSessionPersistence] });
  auth.languageCode = 'ja';
  const db = F.initializeFirestore(app, {
    ignoreUndefinedProperties: true,
    localCache: keep ? F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) : F.memoryLocalCache()
  });
  fb = { app, auth, db, A, F, appM };
}
/** v2.1 までに端末へ残ったサインイン情報・データの写しを消す（同じアドレスの別のページから読まれないように） */
async function forgetLocalTraces() {
  try { Object.keys(localStorage).filter((k) => k.startsWith('firebase:authUser:')).forEach((k) => localStorage.removeItem(k)); } catch { /* なし */ }
  const del = (name) => new Promise((res) => { try { const r = indexedDB.deleteDatabase(name); r.onsuccess = r.onerror = r.onblocked = () => res(); setTimeout(res, 1500); } catch { res(); } });
  await Promise.all(['firebaseLocalStorageDb', `firestore/[DEFAULT]/${CONFIG.FIREBASE.projectId}/main`].map(del));
}
const actionSettings = () => ({ url: location.origin + location.pathname, handleCodeInApp: false });

/** サインインまわりの窓口（本番とデモで中身が違う） */
const Auth = {
  async signIn(email, pw) {
    if (state.mode === 'demo') return null;
    const { A } = fb;
    await A.setPersistence(fb.auth, A.browserSessionPersistence);
    return (await A.signInWithEmailAndPassword(fb.auth, email, pw)).user;
  },
  async signOut() { if (state.mode === 'live') await fb.A.signOut(fb.auth); },
  async sendSetup(email) { if (state.mode === 'demo') { toast('デモなのでメールは送りません'); return; } await fb.A.sendPasswordResetEmail(fb.auth, email, actionSettings()); },
  async changePassword(current, next) {
    if (state.mode === 'demo') { await sleep(300); toast('デモなので変更はされません'); return; }
    const { A } = fb, u = fb.auth.currentUser;
    try { await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, current)); }
    catch (e) { if (!e || e.code !== 'auth/multi-factor-auth-required') throw e; await Mfa.resolve(e); }   // 2段階認証のコードも確かめる
    await A.updatePassword(u, next);
    Notify.send('passwordChanged');
  },
  async sendVerify() { if (state.mode === 'demo') { toast('デモなのでメールは送りません'); return; } await fb.A.sendEmailVerification(fb.auth.currentUser, actionSettings()); },
  async idToken(force) { return state.mode === 'live' && fb.auth.currentUser ? fb.auth.currentUser.getIdToken(!!force) : ''; },
  emailVerified() { return state.mode !== 'live' || !fb.auth.currentUser || fb.auth.currentUser.emailVerified; },
  async afterSignIn(kind) {

    if (state.mode === 'demo') return [{ at: new Date(), ua: uaSummary(), shared: false }, { at: addDays(new Date(), -1), ua: 'iPhone / Safari', shared: false }];
    return DB.list(`members/${uid}/logins`, { order: [['at', 'desc']], limit: 20 });
  }
};

/* ==========================================================================
   2段階認証（スマホの認証アプリの6けたのコード＝TOTP）
   ・職員・管理者・責任者は必須（はじめてサインインしたときに登録）。キオスク・裏方の自動処理は使わない

   ========================================================================== */
const Mfa = {
  factors() { const u = fb && fb.auth.currentUser; return u ? fb.A.multiFactor(u).enrolledFactors || [] : []; },
  hasTotp() { return this.factors().some((f) => f.factorId === fb.A.TotpMultiFactorGenerator.FACTOR_ID); },
  needed(member) { return state.mode === 'live' && MFA_ROLES.includes(member && member.role); },
  /** パスワードの確認のあとで6けたのコードを聞く（パスワード変更など、サインインの画面以外） */
  async resolve(err) {
    const { A } = fb;
    const resolver = A.getMultiFactorResolver(fb.auth, err);
    const hint = resolver.hints.find((x) => x.factorId === A.TotpMultiFactorGenerator.FACTOR_ID);
    if (!hint) throw uerr('この2段階認証の方法には対応していません。責任者に連絡してください');
    const code = await askText('2段階認証のコード', { message: 'スマホの認証アプリに出ている6けたのコードを入れてください。', ok: '確認', required: true, max: 8 });
    if (!code) throw uerr('やめました');
    return resolver.resolveSignIn(A.TotpMultiFactorGenerator.assertionForSignIn(hint.uid, code.replace(/\D/g, '')));
  },
  /** 登録の部品（QR・手入力用の文字・コードの欄）。登録できたら onDone */
  async enrollEl(user, onDone) {
    const { A } = fb;
    const secret = await A.TotpMultiFactorGenerator.generateSecret(await A.multiFactor(user).getSession());
    const url = secret.generateQrCodeUrl(user.email, 'M-TIC職員ポータル');
    const qr = h('div', { style: { display: 'flex', justifyContent: 'center', margin: '8px 0' } }, loadingEl());

    const code = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 8, placeholder: '123456', 'aria-label': '6けたのコード' });
    const name = h('input', { type: 'text', maxlength: 30, value: 'スマホの認証アプリ', 'aria-label': '名前' });

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const v = code.value.replace(/\D/g, '');
      if (v.length !== 6) return msgBox(msg, '6けたの数字を入れてください');
      go.disabled = true;
      try { await A.multiFactor(user).enroll(A.TotpMultiFactorGenerator.assertionForEnrollment(secret, v), name.value.trim() || 'スマホの認証アプリ'); await onDone(); }

        h('li', 'アプリで「QRコードをスキャン」して、下のQRを読む'),

      qr,
      h('details.small', { style: { margin: '4px 0 12px' } }, h('summary', 'QRが読めないとき（手で入れる文字）'), h('div.mono', { style: { wordBreak: 'break-all', margin: '6px 0' } }, secret.secretKey), h('div.muted', '種類：時間ベース（TOTP）・6けた・30秒')),

    h('p.lead', '職員ポータルは「パスワード＋スマホの認証アプリの6けたのコード」でサインインします。パスワードが漏れても、スマホがなければ入れません。'),

/** メールのリンク（パスワード設定・メール確認）から開かれたとき */
async function handleActionLink() {
  const p = new URLSearchParams(location.search);
  const mode = p.get('mode'), code = p.get('oobCode');
  if (!mode || !code) return false;
  const clean = () => history.replaceState(null, '', location.pathname + location.hash);
  const { A } = fb;
  if (mode === 'resetPassword') {
    let email = '';
    try { email = await A.verifyPasswordResetCode(fb.auth, code); }
    catch (e) { clean(); screenSignin(); toast(errText(e), 'err', 6000); return true; }
    const w = pwWidget(() => email);
    const msg = h('div');
    const go = h('button.btn.primary.block', { type: 'submit' }, 'この内容で設定する');
    const form = h('form', { novalidate: true }, w.el, msg, go);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const r = await w.validate();
      if (!r.ok) return msgBox(msg, r.msg);
      go.disabled = true;
      try {
        await A.confirmPasswordReset(fb.auth, code, w.value());
        clean();
        markJust('login');
        state.settingPw = false;
        toast('パスワードを設定しました' + (r.warn ? '（' + r.warn + '）' : ''), 'ok');
        try { await A.signInWithEmailAndPassword(fb.auth, email, w.value()); }
        catch (e2) { if (e2 && e2.code === 'auth/multi-factor-auth-required') { screenMfa(e2); return; } throw e2; }
      } catch (err) { msgBox(msg, errText(err)); go.disabled = false; }
    });
    state.settingPw = true;
    mount($('#root'), h('div.center', h('div.card.wide', h('div.row', logoEl(), h('span.badge', 'M-TIC職員専用')), h('h1', 'パスワードを設定する'), h('p.lead', `${email} のパスワードを設定します。`), form)));
    return true;
  }
  if (mode === 'verifyEmail') {
    try { await A.applyActionCode(fb.auth, code); toast('メールアドレスを確認しました', 'ok'); if (fb.auth.currentUser) await fb.auth.currentUser.reload(); }
    catch (e) { toast(errText(e), 'err'); }
    clean();
    return false;
  }
  clean();
  return false;
}

async function doSignOut(reason) {
  const wasKiosk = state.mode === 'live' && isKiosk();
  closeAllDialogs();
  Router.leave();
  state.unsub.forEach((u) => { try { u(); } catch { /* なし */ } }); state.unsub = [];
  Live.reset();
  if (state.mode === 'demo') { state.member = null; store.sset('mtic-demo', null); location.hash = ''; location.reload(); return; }
  try {
    await Auth.signOut();
    if (state.shared) { store.sset('mtic-shared', null); state.shared = false; }
    if (wasKiosk) {              // キオスクをやめる：端末に残したデータの写しも消して、ふつうの端末にもどす
      store.set('mtic-kiosk-device', null); store.sset('mtic-nokeep', null);
      try { await fb.F.terminate(fb.db); await fb.F.clearIndexedDbPersistence(fb.db); } catch { /* なし */ }
      state.reloading = true;
      location.reload();
      return;
    }
  } catch (e) { toast(errText(e), 'err'); }
  if (reason) toast(reason, '', 6000);
}

/* ==========================================================================
   裏方GAS（メール通知・チャットのファイル保存）を呼ぶ
   ========================================================================== */
const Notify = {
  enabled() { return state.mode === 'live' && !!CONFIG.NOTIFY_URL; },
  /** 返事を待つ呼び出し（ファイルの保存・取り出しなど） */
  async call(action, payload = {}, o = {}) {
    if (state.mode === 'demo') throw uerr('デモ表示では使えません');
    if (!CONFIG.NOTIFY_URL) throw uerr('裏方GAS（NOTIFY_URL）がまだ設定されていません。管理者に連絡してください');
    const idToken = await Auth.idToken(!!o.fresh);
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), o.timeout || 30000);
    try {
      const res = await fetch(CONFIG.NOTIFY_URL, {
        method: 'POST', signal: ctl.signal, redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payload, action, idToken, ua: uaSummary(), shared: !!state.shared, portal: location.origin + location.pathname })
      });
      const j = await res.json();
      if (!j.ok) throw uerr(GAS_ERRORS[j.error] || ('裏方GASでエラー：' + (j.error || '不明')));
      return j;
    } catch (e) {
      if (e.name === 'AbortError') throw uerr('時間がかかりすぎました。電波の良いところでもう一度試してください');
      if (e.userMessage) throw e;
      throw uerr('裏方GASにつながりませんでした（' + (e.message || '') + '）');
    } finally { clearTimeout(t); }
  },
  /** 返事を待たない通知（ログイン通知など。失敗しても止めない） */
  send(action, extra = {}) {
    if (!this.enabled()) return;
    this.call(action, extra, { timeout: 15000 }).catch((e) => console.warn('通知を送れませんでした', action, e));
  }
};
const GAS_ERRORS = {

  too_soon: '続けては送れません。少し待ってからもう一度試してください', no_bridge: '裏方GASの自動処理用アカウント（BRIDGE）がまだ設定されていません',
  need_auth: '裏方GASに、フォーム（またはシート）を読む許可がまだありません。団体のアカウントでGASのエディタを開き、checkSetup を1回実行して「許可」してください',

  return String(pattern).replace('{YYYY}', d.getFullYear()).replace('{YY}', String(d.getFullYear()).slice(2)).replace(/\{(N+)\}/, (_, ns) => String(n).padStart(ns.length, '0'));

const Router = {
  cleanups: [], current: null,
  go(path) { if (location.hash === '#' + path) this.resolve(); else location.hash = path; },
  leave() { this.cleanups.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); this.cleanups = []; },
  start() { window.addEventListener('hashchange', () => this.resolve()); this.resolve(); },
  resolve() {
    if (!state.member) return;
    closeAllDialogs();
    $$('.menu.pop').forEach((m) => m.remove());
    this.leave();
    const raw = location.hash.replace(/^#/, '') || '/';
    const [pathPart, qs] = raw.split('?');
    const parts = pathPart.split('/').filter(Boolean).map(decodeURIComponent);
    const q = new URLSearchParams(qs || '');
    if (isKiosk()) { renderKioskScreen(); return; }
    if (parts[0] === 'a' && parts[1]) {
      const app = CONFIG.APPS.find((a) => a.id === parts[1]);
      if (!app || !app.module || !Apps[app.module] || !canSee(app)) { toast('このアプリは開けません'); this.go('/'); return; }
      this.current = app.id;
      renderAppPage(app, parts.slice(2), q);
      return;
    }
    this.current = null;
    renderHome();
  }
};
function canSee(a) {

function renderAppPage(app, parts, q) {
  const def = Apps[app.module];
  const main = h(def.full ? 'main.full' : 'main.page');
  mount($('#root'), headerEl(app), main);
  window.scrollTo(0, 0);
  document.title = app.name + '｜M-TIC職員ポータル';
  const ctx = {
    app, parts, q, el: main,
    track(fn) { if (typeof fn === 'function') Router.cleanups.push(fn); return fn; },
    go(sub, query) { Router.go(`/a/${app.id}${sub ? '/' + sub : ''}${query ? '?' + new URLSearchParams(query) : ''}`); },
    /** タブとボタンを並べる。戻り値の body に中身を入れる */
    head(o = {}) {
      const bar = h('div.row', { style: { marginBottom: '12px', alignItems: 'flex-start' } });
      if (o.tabs) bar.appendChild(h('div.grow', tabsEl(o.tabs, o.tab, o.onTab || ((t) => ctx.go(t)))));
      else bar.appendChild(h('div.grow', o.title ? h('h2', { style: { margin: '4px 0', fontSize: '18px' } }, o.title) : null));
      if (o.actions) bar.appendChild(h('div.row', o.actions.filter(Boolean)));
      main.appendChild(bar);
      const body = h('div');
      main.appendChild(body);
      return body;
    }
  };
  try { def.render(ctx); } catch (e) { console.error(e); mount(main, h('div.msg.err', '画面を作れませんでした：' + (e.message || e))); }
}

/* ==========================================================================
   機材利用（使い始め・終わり・利用記録・貸出／持出・機材のQRラベル）
   データ：equipment/{機材コード}  usage/{ID}  lending/{ID}
   ========================================================================== */
const EQUIP_KINDS = ['3Dプリンター', '切削・加工', '電気・検査', 'PC・ソフト', '工具', 'その他'];
const EQUIP_STATUS = { ok: ['使用可', 'c-green'], maint: ['メンテ中', 'c-red'], retired: ['廃棄・休止', 'c-gray'] };
const Equip = {
  store() { return Live.list('equipment'); },
  rows() { return sortBy(this.store().rows.filter((e) => e.status !== 'retired'), 'order', 'code'); },
  get(code) { return this.store().rows.find((e) => e.code === code || e.id === code) || null; },
  dueSoon(days = 7) { const lim = ymd(addDays(new Date(), days)); return this.store().rows.filter((e) => e.status !== 'retired' && e.nextDue && e.nextDue <= lim); },
  /** 使い始める（本人・キオスク・管理者の代理） */
  async start(code, who, o = {}) {
    const e = this.get(code) || await DB.get('equipment/' + code);
    if (!e) throw uerr('機材が見つかりません：' + code);
    if (e.status === 'maint') throw uerr(`${e.name} はメンテ中のため使えません`);
    if (e.inUse && e.inUse.uid === who.uid) throw uerr('すでに使用中になっています');
    const ops = [];
    if (e.inUse && e.inUse.usageId) {
      // 前の人が終わり忘れていたら、ここで終わりにする
      ops.push({ op: 'update', path: 'usage/' + e.inUse.usageId, data: { end: DB.now(), open: false, minutes: minutesBetween(e.inUse.since, new Date()), note: '（次の人が使い始めたので自動で終了）' } });
    }
    const id = DB.newId('usage');
    const now = new Date();
    const rec = { code: e.code, equipName: e.name, uid: who.uid, name: who.name, start: DB.now(), end: null, open: true, minutes: 0, purpose: o.purpose || '', ref: o.ref || '', via: o.via || 'self', date: ymd(now), ym: ym(now) };
    if (o.cardId) rec.cardId = o.cardId;
    ops.push({ op: 'set', path: 'usage/' + id, data: rec });
    ops.push({ op: 'update', path: 'equipment/' + e.code, data: { inUse: { uid: who.uid, name: who.name, since: DB.now(), usageId: id, purpose: o.purpose || '' }, lastUsedAt: DB.now() } });
    await DB.batch(ops);
    this.announce(`▶ ${who.name} さんが「${e.name}（${e.code}）」を使い始めました${o.purpose ? '：' + o.purpose : ''}`, { code: e.code });
    Notify.send('equipStart', { usageId: id });
    return id;
  },
  /** 使い終わる */
  async end(code, o = {}) {
    const e = this.get(code) || await DB.get('equipment/' + code);
    if (!e || !e.inUse) throw uerr('使用中ではありません');
    const min = minutesBetween(e.inUse.since, new Date());
    const ops = [
      { op: 'update', path: 'equipment/' + e.code, data: { inUse: null, useCount: DB.inc(1), totalMin: DB.inc(min) } }
    ];
    if (e.inUse.usageId) ops.push({ op: 'update', path: 'usage/' + e.inUse.usageId, data: { end: DB.now(), open: false, minutes: min, condition: o.condition || '良', note: o.note || '', endBy: o.endBy || '' } });
    await DB.batch(ops);
    this.announce(`■ ${e.inUse.name} さんが「${e.name}（${e.code}）」を使い終わりました（${fmtMin(min)}）${o.condition === '不調' ? '　⚠ 不調の報告あり：' + (o.note || '') : ''}`, { code: e.code });
    Notify.send('equipEnd', { usageId: e.inUse.usageId || '' });
    return min;
  },
  /** チャットの「機材のお知らせ」に流す（失敗しても記録は残っているので気にしない） */
  announce(text, extra = {}) {
    if (Org.get().equipNotifyChannel === false) return;
    Chat.system('sys-equip', text, extra).catch((e) => console.warn('お知らせを流せませんでした', e));
  }
};

/* ==========================================================================
   入退室（在室ボード・記録・月の集計）
   データ：presence/{会員uid}（いまの状態）  entries/{ID}（入室・退室の記録）
   ========================================================================== */
const Entry = {
  presence() { return Live.list('presence'); },
  /** 入室 */
  async checkIn(who, o = {}) {
    const cur = await DB.get('presence/' + who.uid);
    const ops = [];
    const now = new Date();
    if (cur && cur.in) {
      if (ymd(cur.since) === ymd(now)) throw uerr(`${who.name} さんはもう入室しています（${hm(cur.since)}〜）`);
      ops.push({ op: 'add', path: 'entries', data: { uid: who.uid, name: who.name, type: 'out', at: toDate(ymd(cur.since) + 'T23:59') || now, via: 'auto', date: ymd(cur.since), ym: ym(cur.since), stayMin: null, note: '退室し忘れ（次の入室で自動）', ...(o.cardId ? { cardId: o.cardId } : {}) } });
    }
    const entry = { uid: who.uid, name: who.name, type: 'in', at: DB.now(), via: o.via || 'self', date: ymd(now), ym: ym(now) };
    if (o.cardId) entry.cardId = o.cardId;
    ops.push({ op: 'add', path: 'entries', data: entry });
    const p = { uid: who.uid, name: who.name, in: true, since: DB.now(), lastIn: DB.now(), via: o.via || 'self' };
    if (o.cardId) p.cardId = o.cardId;
    ops.push({ op: 'set', path: 'presence/' + who.uid, data: p, merge: true });
    await DB.batch(ops);
  },
  /** 退室 */
  async checkOut(who, o = {}) {
    const cur = await DB.get('presence/' + who.uid);
    if (!cur || !cur.in) throw uerr(`${who.name} さんは入室していません`);
    const now = new Date();
    const stale = ymd(cur.since) !== ymd(now);
    const stay = stale ? null : minutesBetween(cur.since, now);
    const entry = { uid: who.uid, name: who.name, type: 'out', at: stale ? (toDate(ymd(cur.since) + 'T23:59') || now) : DB.now(), via: o.via || 'self', date: stale ? ymd(cur.since) : ymd(now), ym: stale ? ym(cur.since) : ym(now), stayMin: stay };
    if (stale) entry.note = '退室し忘れ（あとで退室）';
    if (o.cardId) entry.cardId = o.cardId;
    const p = { uid: who.uid, name: who.name, in: false, lastOut: DB.now(), via: o.via || 'self' };
    if (o.cardId) p.cardId = o.cardId;
    await DB.batch([{ op: 'add', path: 'entries', data: entry }, { op: 'set', path: 'presence/' + who.uid, data: p, merge: true }]);
    return stay;
  }
};

/* ==========================================================================
   IDカード（QR）とキオスク（機材置き場の共用端末）
   データ：cardSecrets/{uid}（カードの中身：責任者と本人だけ見られる）
           cards/{カードの指紋}（キオスクがカードから会員を調べる表。指紋＝中身のSHA-256）
   ========================================================================== */
const Cards = {
  async issue(m) {
    const token = randomToken();
    const cardId = await sha256Hex(token);
    const old = await DB.get('cardSecrets/' + m.id);
    const ops = [
      { op: 'set', path: 'cardSecrets/' + m.id, data: { token, cardId, issuedAt: DB.now(), issuedBy: myUid() } },
      { op: 'set', path: 'cards/' + cardId, data: { uid: m.id, name: m.name, memberNo: m.memberNo || '', active: true, issuedAt: DB.now() } }
    ];
    if (old && old.cardId && old.cardId !== cardId) ops.push({ op: 'delete', path: 'cards/' + old.cardId });
    await DB.batch(ops);
    return token;
  },
  async stop(m) {
    const old = await DB.get('cardSecrets/' + m.id);
    const ops = [{ op: 'delete', path: 'cardSecrets/' + m.id }];
    if (old && old.cardId) ops.push({ op: 'delete', path: 'cards/' + old.cardId });
    await DB.batch(ops);
  },
  /** キオスクでカードを読んだとき：中身 → 会員 */
  async resolve(token) {
    const cardId = await sha256Hex(token);
    const c = await DB.get('cards/' + cardId);
    if (!c || c.active === false) return null;
    return { uid: c.uid, name: c.name, memberNo: c.memberNo, cardId };
  },
  /** IDカードの印刷用HTML（A4・10面 91×55mm の名刺用紙） */
  async sheetHtml(list) {
    await Codes.ready();
    const org = Org.get();
    const cards = list.map((x) => `<div class="pcard"><div class="band"><i></i></div><div class="cin"><div class="info">
      <div class="org">${esc(org.name)}</div><div class="lbl">MEMBER ID CARD</div>
      <div class="nm">${esc(x.name)}</div><div class="no">${esc(x.memberNo || '')}</div><div class="rl">${esc(ROLES[x.role] || '')}</div></div>
      <div class="qr">${Codes.qrSvg(Codes.cardText(x.token), { size: '25mm', margin: 1 })}<small>機材置き場の端末にかざす<br>なくしたら責任者へ</small></div></div></div>`);
    const pages = [];
    for (let i = 0; i < cards.length; i += 10) pages.push(`<div class="ppage a4" style="padding:11mm 14mm 0"><div style="display:grid;grid-template-columns:91mm 91mm;grid-auto-rows:55mm">${cards.slice(i, i + 10).join('')}</div></div>`);
    return pages.join('');
  }
};

/* ---------- 自分のIDカード（スマホに表示してキオスクにかざせる） ---------- */

/* ---------- IDカードの管理（責任者） ---------- */
defineApp('cards', {
  render(ctx) {
    const body = ctx.head({ title: 'IDカード（機材置き場でかざすQR）' });

    const tools = h('div.toolbar');
    mount(body, h('p.small.muted.mt0', 'カードのQRには、その人専用の長いランダムな文字が入っています。再発行すると前のカードはすぐ使えなくなります。印刷は市販の名刺用紙（A4・10面・91×55mm）を使います。'), tools, list);
    const draw = () => {
      const rows = sortBy(members.filter((m) => m.role !== 'bridge'), 'memberNo');
      mount(tools,
        btn(`選んだ人のカードを印刷（${sel.size}人）`, async (e, b) => {
          const pick = rows.filter((m) => sel.has(m.id) && secrets.get(m.id));
          if (!pick.length) { toast('発行済みの人を選んでください'); return; }
          await act(b, async () => Print.preview({ title: 'IDカードの印刷（A4・10面）', html: await Cards.sheetHtml(pick.map((m) => ({ ...m, token: secrets.get(m.id).token }))), size: 'A4', note: '名刺用紙（A4・10面 91×55mm、上下11mm・左右14mm）に「実際のサイズ（100%）」で印刷してください。' }));
        }, 'primary', 'printer'),
        btn('未発行の人に一括発行', async (e, b) => {
          const todo = rows.filter((m) => m.active && !secrets.get(m.id) && m.role !== 'kiosk');
          if (!todo.length) { toast('未発行の人はいません'); return; }
          if (!await ask(`${todo.length}人にカードを発行しますか？`, { ok: '発行する' })) return;
          await act(b, async () => { for (const m of todo) await Cards.issue(m); await reload(); }, '発行しました');
        }, '', 'idcard'));
      mount(list, dataTable({ rows, empty: '会員がいません', cols: [
        { k: 'sel', label: h('input', { type: 'checkbox', 'aria-label': '全員を選ぶ', checked: rows.length && rows.every((m) => sel.has(m.id)), onchange: (e) => { if (e.target.checked) rows.forEach((m) => sel.add(m.id)); else sel.clear(); draw(); } }), render: (m) => h('input', { type: 'checkbox', checked: sel.has(m.id), onchange: (e) => { if (e.target.checked) sel.add(m.id); else sel.delete(m.id); draw(); } }) },
        { k: 'memberNo', label: '会員番号', cls: 'nw' }, { k: 'name', label: '名前' }, { k: 'role', label: '役割', render: (m) => ROLES[m.role] || m.role },
        { k: 'card', label: 'カード', render: (m) => (secrets.get(m.id) ? h('span', stChip('発行済み', 'c-green'), h('span.xs.muted', ' ' + fmtYmd(secrets.get(m.id).issuedAt))) : stChip('未発行', 'c-gray')) },
        { k: 'x', label: '', render: (m) => h('div.rowact',
          btn(secrets.get(m.id) ? '再発行' : '発行', async (e, b) => {
            if (secrets.get(m.id) && !await ask(`${m.name} さんのカードを作り直しますか？ 前のカードは使えなくなります。`, { ok: '作り直す' })) return;
            await act(b, async () => { await Cards.issue(m); await reload(); }, 'カードを発行しました（印刷して渡してください）');
          }, 'sm'),
          secrets.get(m.id) ? btn('止める', async (e, b) => { if (!await ask(`${m.name} さんのカードを使えなくしますか？`, { danger: true, ok: '止める' })) return; await act(b, async () => { await Cards.stop(m); await reload(); }, '止めました'); }, 'sm danger') : null) }
      ] }));
    };
    const reload = async () => {
      const ss = await DB.list('cardSecrets', {});
      secrets = new Map(ss.map((s) => [s.id, s]));
      draw();
    };
    ctx.track(DB.watch('members', {}, (r) => { members = r; draw(); }));
    reload().catch((e) => toast(errText(e), 'err'));
  }
});

function kioskView(root, o) {
  const clock = h('div.clock');
  const tick = () => { const n = new Date(); clock.textContent = `${n.getMonth() + 1}/${n.getDate()}（${DOW[n.getDay()]}） ${hm(n)}`; };
  tick(); const ct = setInterval(tick, 10000); o.track(() => clearInterval(ct));
  const box = h('div.kbox');
  const foot = h('div', { style: { padding: '0 20px 16px' } });
  const head = h('div.kh', logoEl(), h('b', '機材置き場'), h('span.badge', 'IDカードで記録'), clock,
    o.preview ? btn('キオスクを閉じる', () => Router.go('/'), 'sm', 'x') : btn('', (e, b) => popMenu(b, [
      { label: 'カメラを切り替え', icon: 'refresh', onClick: () => cam && cam.switchCamera() },
      { label: '画面を再読み込み', icon: 'refresh', onClick: () => location.reload() },
      { label: 'サインアウト', icon: 'logout', onClick: () => doSignOut() }
    ]), 'sm icon ghost', 'more', { 'aria-label': 'メニュー' }));
  mount(root, h('div.kiosk', head, h('div.kb', box), foot));
  let cam = null, idleTimer = null, busyNow = false, doneSeq = 0;
  const stopCam = () => { if (cam) { cam.stop(); cam = null; } };
  o.track(stopCam);
  const resetIdle = () => { clearTimeout(idleTimer); idleTimer = setTimeout(showIdle, (CONFIG.KIOSK_IDLE_SECONDS || 25) * 1000); };
  o.track(() => clearTimeout(idleTimer));
  // USBのQRリーダー
  o.track(listenWedge((code, p) => { if (p.kind === 'card') onCard(p.token); }));
  // 使用中の機材を下に表示
  o.track(Equip.store().on((rows) => {
    const inuse = rows.filter((e) => e.inUse);
    mount(foot, inuse.length ? h('div.row', h('span.small.muted', '使用中：'), inuse.map((e) => h('span.badge', `${e.code}（${e.inUse.name}・${hm(e.inUse.since)}〜）`))) : h('span.small.muted', 'いま使用中の機材はありません'));
  }));

  function showIdle() {
    clearTimeout(idleTimer); busyNow = false; doneSeq++;
    stopCam();
    cam = Scanner.view({ formats: 'qr', facing: store.get('mtic-kiosk-facing') || 'user', camKey: 'kiosk', hint: 'IDカードのQRを枠に入れてください', cooldown: 4000, onCode: (text, p) => { if (p.kind === 'card') onCard(p.token); else if (p.kind === 'equip') toast('先にIDカードをかざしてください'); else toast('IDカードではありません', 'err'); return true; } });
    mount(box, h('div', { style: { fontSize: '26px', fontWeight: 800 } }, 'IDカードをかざしてください'),
      h('p.muted', '入室・退室、機材の使い始め・使い終わりを記録します'),
      cam.el,
      h('p.small.muted', 'カードを忘れたら、自分のスマホのポータル →「自分のIDカード」のQRを見せてもOK'));
    cam.start().catch((e) => { box.appendChild(h('div.msg.err', errText(e) + '（USBのQRリーダーなら、そのまま読めます）')); });
  }
  async function onCard(token) {
    if (busyNow) return;
    busyNow = true;
    stopCam();
    mount(box, loadingEl(), h('p.muted', '確認しています…'));
    let who = null;
    try { who = await Cards.resolve(token); } catch (e) { console.error(e); }
    busyNow = false;   // 読み取りの処理が終わったら、次のカードを受け付ける
    if (!who) { beep(false); mount(box, h('div.kbig', { style: { color: 'var(--danger)' } }, 'このカードは使えません'), h('p', '再発行された古いカードか、止められたカードです。責任者に確認してください。')); const t = ++doneSeq; setTimeout(() => { if (t === doneSeq && box.isConnected) showIdle(); }, 4000); return; }
    showMember(who);
  }
  async function showMember(who) {
    resetIdle(); doneSeq++;
    const pres = await DB.get('presence/' + who.uid).catch(() => null);
    const inNow = pres && pres.in && ymd(pres.since) === today();
    const using = Equip.rows().filter((e) => e.inUse && e.inUse.uid === who.uid);
    const doAct = async (fn, msg) => {
      resetIdle();
      try { await fn(); beep(true); done(msg); } catch (e) { beep(false); toast(errText(e), 'err', 5000); showMember(who); }
    };
    const grid = h('div.kgrid',
      inNow ? kbtn('退室する', '帰るとき', 'logout', 'stop', () => doAct(() => Entry.checkOut(who, { via: 'kiosk', cardId: who.cardId }), `${who.name} さん、おつかれさまでした`))
        : kbtn('入室する', '来たとき', 'door', 'in', () => doAct(() => Entry.checkIn(who, { via: 'kiosk', cardId: who.cardId }), `${who.name} さん、こんにちは`)),
      kbtn('機材を使う', '使い始め', 'play', 'go', () => pickEquip(who)),
      ...using.map((e) => kbtn(`${e.code} を使い終わる`, `${hm(e.inUse.since)}〜 ${fmtMin(minutesBetween(e.inUse.since, new Date()))}`, 'stop', 'stop', () => endEquip(who, e))),

/* ==========================================================================
   M-TICタスカー（タスク管理：表・ガント・目標までのカウントダウン）
   データ：tasks/{ID}  config/tasker（目標）
   ID の付け方：親タスク T1, T2 … ／ 子タスク T1-1, T1-2 …（Mロボ タスク管理票と同じ）
   ========================================================================== */
const TASK_ST = ['未着手', '進行中', '保留', '完了'];
const TASK_ST_CLS = { '未着手': 'c-gray', '進行中': 'c-blue', '保留': 'c-orange', '完了': 'c-green' };
const Tasker = {
  nextCode(tasks, parent) {
    if (parent) {
      const nums = tasks.filter((t) => t.parent === parent).map((t) => parseInt(String(t.code || '').split('-').pop(), 10) || 0);
      return `${parent}-${Math.max(0, ...nums) + 1}`;
    }
    const nums = tasks.filter((t) => !t.parent).map((t) => parseInt(String(t.code || '').replace(/^T/, ''), 10) || 0);
    return 'T' + (Math.max(0, ...nums) + 1);
  },
  /** 親→子の順に並べる */
  tree(tasks) {
    const codeKey = (c) => String(c || '').replace(/^T/, '').split('-').map((n) => String(parseInt(n, 10) || 0).padStart(4, '0')).join('-');
    const parents = sortBy(tasks.filter((t) => !t.parent || !tasks.some((p) => p.code === t.parent)), (t) => codeKey(t.code));
    const out = [];
    parents.forEach((p) => { out.push({ ...p, depth: 0 }); sortBy(tasks.filter((c) => c.parent && c.parent === p.code), (t) => codeKey(t.code)).forEach((c) => out.push({ ...c, depth: 1 })); });
    return out;
  }
};

defineApp('tasker', {

    };

    ctx.track(DB.watch('tasks', { where: [['archived', '==', false]] }, (r) => { tasks = r; draw(); }));

function ganttEl(rows, all) {

async function importTasks(tasks) {

const EV_KINDS = { katsudo: '活動日', teirei: '定例会', soukai: '総会', riji: '理事会', event: 'イベント', other: 'その他' };
const EV_CLS = { katsudo: 'k-katsudo', teirei: 'k-teirei', soukai: 'k-soukai', riji: 'k-event', event: 'k-event', other: '' };
const MEETING_KINDS = ['teirei', 'soukai', 'riji'];
const Sched = {
  /** 期間内の予定（くり返しを広げる） */
  expand(evs, from, to) {
    const out = [];
    evs.forEach((e) => {
      if (!e.date) return;
      if (e.repeat === 'weekly') {
        let d = toDate(e.date);
        const end = e.until && e.until < to ? e.until : to;
        while (ymd(d) < from) d = addDays(d, 7);
        while (ymd(d) <= end) { const s = ymd(d); if (!(e.exceptions || []).includes(s)) out.push({ ...e, date: s, occ: true }); d = addDays(d, 7); }
      } else if (e.date >= from && e.date <= to) out.push(e);
    });
    return sortBy(out, 'date', (x) => (x.allDay ? '' : x.start || ''));
  },
  /** 期間の予定を見張る（cb に広げた一覧） */
  watchRange(from, to, cb) {
    let a = [], b = [];
    const fire = () => cb(this.expand([...a, ...b], from, to));
    const u1 = DB.watch('events', { where: [['date', '>=', from], ['date', '<=', to]] }, (r) => { a = r.filter((x) => x.repeat !== 'weekly'); fire(); });
    const u2 = DB.watch('events', { where: [['repeat', '==', 'weekly']] }, (r) => { b = r; fire(); });
    return () => { u1(); u2(); };
  },
  upcoming(days, cb) { return this.watchRange(today(), ymd(addDays(new Date(), days)), cb); }
};

      cell.addEventListener('click', () => eventForm(null, { date: s }));

    mount(cal, h('div.cal', cells), h('p.xs.muted', '日にちを押すと予定を追加、予定を押すと詳しく見られます。色：', Object.entries(EV_KINDS).map(([k, v]) => h('span.ev.' + (EV_CLS[k] || 'x'), { style: { display: 'inline-block', margin: '0 4px' } }, v))));

function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
async function exportIcs(cur) {
  const from = ymd(addMonths(cur, -1)), to = ymd(addMonths(cur, 6));
  const a = await DB.list('events', { where: [['date', '>=', from], ['date', '<=', to]] });
  const b = await DB.list('events', { where: [['repeat', '==', 'weekly']] });
  const evs = [...a.filter((x) => x.repeat !== 'weekly'), ...b];
  const dt = (d, t) => d.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//M-TIC//Portal//JA', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:M-TIC予定', 'X-WR-TIMEZONE:Asia/Tokyo'];
  evs.forEach((e) => {
    lines.push('BEGIN:VEVENT', `UID:${e.id}@mtic-portal`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, `SUMMARY:${icsEsc(e.title)}`);
    if (e.allDay) { lines.push(`DTSTART;VALUE=DATE:${dt(e.date)}`, `DTEND;VALUE=DATE:${dt(ymd(addDays(e.date, 1)))}`); }
    else { lines.push(`DTSTART:${dt(e.date, e.start || '00:00')}`, `DTEND:${dt(e.date, e.end || e.start || '00:00')}`); }
    if (e.repeat === 'weekly') { lines.push('RRULE:FREQ=WEEKLY' + (e.until ? `;UNTIL=${dt(e.until)}T235959` : '')); (e.exceptions || []).forEach((x) => lines.push(e.allDay ? `EXDATE;VALUE=DATE:${dt(x)}` : `EXDATE:${dt(x, e.start || '00:00')}`)); }
    if (e.place) lines.push(`LOCATION:${icsEsc(e.place)}`);
    if (e.note) lines.push(`DESCRIPTION:${icsEsc(e.note)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  download('mtic-schedule.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  toast('ファイルを保存しました。スマホやGoogleカレンダーで開くと取り込めます');
}
function printMonth(cur, evs) {
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const start = addDays(first, -first.getDay());
  const byDay = groupBy(evs, (e) => e.date);
  let rows = '';
  for (let w = 0; w < 6; w++) {
    let tr = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, w * 7 + i); const s = ymd(d);
      const list = (byDay.get(s) || []).map((e) => `<div style="font-size:8pt;line-height:1.25;margin:0.5mm 0">${e.allDay ? '' : esc(e.start || '') + ' '}${esc(e.title)}</div>`).join('');
      tr += `<td style="height:28mm;vertical-align:top;width:14.28%;${d.getMonth() !== cur.getMonth() ? 'color:#aaa;' : ''}"><b style="${i === 0 ? 'color:#c00' : i === 6 ? 'color:#0043A8' : ''}">${d.getDate()}</b>${list}</td>`;
    }
    rows += `<tr>${tr}</tr>`;
    if (addDays(start, (w + 1) * 7).getMonth() !== cur.getMonth() && w >= 3) break;
  }
  const html = P.page(`<h1 class="sm">${cur.getFullYear()}年${cur.getMonth() + 1}月　予定表</h1><table><tr>${DOW.map((d) => `<th>${d}</th>`).join('')}</tr>${rows}</table>`, { landscape: true, gothic: true });

/* ---- 26_chat.js ---- */
/* ==========================================================================
   チャット（チャンネル・DM・ファイル共有・お知らせ）
   データ：channels/{ID}（+ messages/{ID}, files/{ID}）  chatReads/{uid}
   ファイル：裏方GAS → 団体のGoogleドライブ（非公開）に保存。会員だけが取り出せる
   ========================================================================== */
const Chat = {
  pub: [], mine: [], reads: {}, started: false, lastSeen: {}, unsubs: [],
  channels() {
    const map = new Map();
    [...this.pub, ...this.mine].forEach((c) => map.set(c.id, c));
    return [...map.values()].filter((c) => !c.archived);
  },
  start() {
    if (this.started || !isStaff()) return () => {};
    this.started = true;
    const recompute = () => this.updateBadge();
    this.unsubs.push(DB.watch('channels', { where: [['kind', '==', 'public']] }, (r) => { this.pub = r; recompute(); }, () => {}));
    this.unsubs.push(DB.watch('channels', { where: [['members', 'array-contains', myUid()]] }, (r) => { this.mine = r; recompute(); }, () => {}));
    this.unsubs.push(DB.watchDoc('chatReads/' + myUid(), (d) => { this.reads = (d && d.reads) || {}; recompute(); }, () => {}));
    return () => { this.unsubs.forEach((u) => u()); this.unsubs = []; this.started = false; this.pub = []; this.mine = []; };
  },
  unread(c) {
    if (!c.lastAt || c.lastBy === myUid()) return false;
    const r = this.reads[c.id];
    return !r || tms(c.lastAt) > tms(r) + 500;
  },
  updateBadge() {
    const list = this.channels();
    const n = list.filter((c) => this.unread(c)).length;
    Badges.set('chat', n ? { text: `未読 ${n}`, n } : null);
    // ブラウザ通知（ポータルを開いている間だけ）
    list.forEach((c) => {
      const prev = this.lastSeen[c.id];
      const now = tms(c.lastAt);
      if (prev !== undefined && now > prev && c.lastBy !== myUid() && this.unread(c) && (document.hidden || Chat.openId !== c.id)) this.browserNotify(c);
      this.lastSeen[c.id] = now;
    });
  },
  browserNotify(c) {
    if (store.get('mtic-bnotify') !== '1' || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { const n = new Notification(`M-TIC：${this.title(c)}`, { body: String(c.lastText || '').slice(0, 100), tag: 'mtic-' + c.id }); n.onclick = () => { window.focus(); Router.go('/a/chat/c/' + c.id); n.close(); }; } catch { /* 通知できない端末 */ }
  },
  title(c) {
    if (!c) return '';
    if (c.kind === 'dm') { const other = (c.members || []).find((u) => u !== myUid()); return (Dir.name(other) || 'DM'); }
    return c.name || c.id;
  },
  markRead(cid) {
    if (!cid || !isStaff()) return;
    const now = Date.now();
    if (this._lastMark && this._lastMark.cid === cid && now - this._lastMark.t < 4000) return;
    this._lastMark = { cid, t: now };
    this.reads = { ...this.reads, [cid]: new Date() };
    this.updateBadge();

    if (extra.link) msg.link = extra.link;

  async openDm(uid) {

defineApp('chat', {

async function openChatFile(cid, mid, f) {
  try {
    let blob;
    if (state.mode === 'demo') {
      if (!f.demoData) { toast('デモでは小さいファイルだけ保存しています（本番では団体のドライブから取り出せます）'); return; }
      blob = dataUrlBlob(f.demoData);
    } else {
      toast('ファイルを取り出しています…', '', 20000);
      const r = await Notify.call('fileGet', { channelId: cid, messageId: mid, fileId: f.id }, { timeout: 120000 });
      const bin = atob(r.data); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      blob = new Blob([arr], { type: r.mime || f.mime });
      toast('', '', 1);
    }
    if (blob.type.startsWith('image/')) {
      const url = URL.createObjectURL(blob);
      const d = openDialog({ title: f.name, size: 'lg', body: h('div', { style: { textAlign: 'center' } }, h('img', { src: url, alt: f.name, style: { maxWidth: '100%', maxHeight: '70vh' } })), onClose: () => URL.revokeObjectURL(url) });
      d.setFoot(btn('保存', () => download(f.name, blob), '', 'download'), btn('閉じる', () => d.close()));
    } else download(f.name, blob);
  } catch (e) { toast(errText(e), 'err', 6000); }
}

const Members = {
  /** 会員名簿と名前の一覧（directory）を同時に直す */
  update(m, patch) {
    const d = {};
    ['name', 'role', 'active', 'memberNo'].forEach((k) => { if (patch[k] !== undefined) d[k] = patch[k]; });
    return DB.batch([{ op: 'update', path: 'members/' + m.id, data: patch }, { op: 'set', path: 'directory/' + m.id, data: d, merge: true }]);
  },
  /** 名前の一覧（directory）を会員名簿に合わせる（v1.0 からの移行・手で名簿を直したとき用）。古いカード用の文字も消す */
  async syncDirectory(members) {
    if (!isOwner()) return 0;
    const dir = new Map((await DB.list('directory', {})).map((d) => [d.id, d]));
    const ops = [], clean = [];
    members.forEach((m) => {
      const want = { name: m.name || '', role: m.role || 'staff', active: m.active !== false, memberNo: m.memberNo || '' };
      const cur = dir.get(m.id);
      if (!cur || cur.name !== want.name || cur.role !== want.role || cur.active !== want.active || cur.memberNo !== want.memberNo) ops.push({ op: 'set', path: 'directory/' + m.id, data: want });
      // v1.0 の名刺用の文字は使わないので消す（名簿の形が整っている人だけ。失敗しても名前の一覧には影響させない）
      if (m.cardToken !== undefined && m.name && m.email && ROLES[m.role] && typeof m.active === 'boolean') clean.push({ op: 'update', path: 'members/' + m.id, data: { cardToken: DB.delField() } });
    });
    if (ops.length) { await DB.batch(ops); toast(`名前の一覧を ${ops.length} 件そろえました`); }
    if (clean.length) await DB.batch(clean).catch((e) => console.warn('古いカード情報の削除', e));
    return ops.length;
  },
  nextNo(existing) {
    const nums = existing.map((m) => parseInt(String(m.memberNo || '').replace(/\D/g, ''), 10) || 0);
    return 'MT-' + String(Math.max(0, ...nums) + 1).padStart(4, '0');
  },
  async invite({ name, email, role }, existing) {
    const memberNo = this.nextNo(existing);
    if (state.mode === 'demo') {
      const uid = 'demo-' + newId().slice(0, 8);
      await DB.batch([{ op: 'set', path: 'members/' + uid, data: { name, email, role, active: true, memberNo, createdAt: DB.now() } }, { op: 'set', path: 'directory/' + uid, data: { name, role, active: true, memberNo } }]);
      return memberNo;
    }
    const { appM, A } = fb;
    const second = appM.initializeApp(CONFIG.FIREBASE, 'invite-' + Date.now());
    try {
      const sAuth = A.initializeAuth(second, { persistence: A.inMemoryPersistence });
      const cred = await A.createUserWithEmailAndPassword(sAuth, email, genPassword(32));   // 仮パスワード（だれにも知らせない）
      const uid = cred.user.uid;
      await A.signOut(sAuth);
      await DB.batch([
        { op: 'set', path: 'members/' + uid, data: { name, email, role, active: true, memberNo, createdAt: DB.now(), createdBy: myUid() } },
        { op: 'set', path: 'directory/' + uid, data: { name, role, active: true, memberNo } }
      ], { wait: true });
      await A.sendPasswordResetEmail(fb.auth, email, actionSettings());
      return memberNo;
    } finally { await appM.deleteApp(second).catch(() => {}); }
  }
};
function inviteForm(members) {
  formDialog({
    title: '会員を招待', size: 'sm', ok: '招待する',
    intro: h('div.tip', '招待するとアカウントができて、本人にパスワード設定メールが届きます。', h('br'), ROLE_HELP),
    fields: [

      { k: 'role', type: 'select', label: '役割', opts: Object.entries(ROLES), empty: false, def: 'staff' }

    onSubmit: async (v) => {

      if (members.some((m) => String(m.email).toLowerCase() === email)) throw uerr('そのメールアドレスはすでに登録されています');
      const no = await Members.invite({ name: v.name, email, role: v.role }, members);
      toast(`${v.name} さんを ${no} で登録し、設定メールを送りました`, 'ok', 5000);
    }
  });
}

function safetyForm(o = {}) {

function judgeDim(spec, tol, actual) {
  const s = num(spec), a = num(actual);
  if (s === null || a === null) return '';
  let lo = -0.5, hi = 0.5;
  const t = String(tol || '').replace(/−/g, '-').replace(/\s/g, '');
  let m;
  if ((m = t.match(/^±([\d.]+)$/))) { lo = -Number(m[1]); hi = Number(m[1]); }
  else if ((m = t.match(/^\+?([\d.]+)\/-?([\d.]+)$/))) { hi = Number(m[1]); lo = -Number(m[2]); }
  else if ((m = t.match(/^\+([\d.]+)-([\d.]+)$/))) { hi = Number(m[1]); lo = -Number(m[2]); }
  else if (t && (m = t.match(/^([\d.]+)$/))) { lo = -Number(m[1]); hi = Number(m[1]); }
  return a >= s + lo - 1e-9 && a <= s + hi + 1e-9 ? '✓' : '×';
}

/* ==========================================================================
   在庫管理（品目・バーコード・ラベル・入出庫・最低在庫→発注／製造・棚卸・取り扱い終了）
   データ：items/{品番}  stockMoves/{ID}  stocktakes/{ID}
   品番：種類ごとの頭文字＋連番（商品 P-001・材料 M-001・部品 B-001・完成品 F-001・消耗品 C-001）
   バーコード：品番をそのまま Code128 に。買った商品のJAN（13けた）も登録できる
   ========================================================================== */
const ITEM_KINDS = ['商品', '材料', '部品', '完成品', '消耗品'];
const MOVE_TYPES = { in: ['仕入', '製作', '返品'], out: ['使用', '販売', '廃棄', '譲渡・配布'] };
const Stock = {
  isLow: (it, qty = it.qty) => it.min !== null && it.min !== undefined && it.min !== '' && Number(qty) <= Number(it.min),
  /** 品番かJANから品目を探す */
  async find(code) {
    code = String(code || '').trim();
    if (!code) return null;
    const it = await DB.get('items/' + code.replace(/\//g, '／')).catch(() => null);
    if (it) return it;
    if (/^\d{8,14}$/.test(code)) { const r = await DB.list('items', { where: [['jan', '==', code]], limit: 1 }); if (r[0]) return r[0]; }
    return null;
  },
  /** 新しい品番を作る（ぶつからないまで進める） */
  async newCode(kind) {
    const pre = Org.get().itemPrefixes[kind] || 'X';
    for (let i = 0; i < 30; i++) {
      const n = await DB.next('item-' + pre);
      const code = `${pre}-${String(n).padStart(3, '0')}`;
      if (!await DB.get('items/' + code)) return code;
    }
    throw uerr('品番を作れませんでした。もう一度試してください');
  },
  /** 入出庫の書き込み（まとめ書き用の op を返す） */
  moveOps(it, delta, type, o = {}) {
    const after = (Number(it.qty) || 0) + delta;
    Shop.later(it.code);   // ネットショップの在庫の数も、あとでそろえる
    const now = new Date();
    const mv = { code: it.code, name: it.name, delta, type, after, ref: o.ref || '', refId: o.refId || '', by: myName(), uid: myUid(), at: DB.now(), date: ymd(now), ym: ym(now), note: o.note || '' };
    if (o.inspection) mv.inspection = o.inspection;
    return [
      { op: 'update', path: 'items/' + it.code, data: { qty: DB.inc(delta), low: Stock.isLow(it, after), lastMoveAt: DB.now() } },
      { op: 'add', path: 'stockMoves', data: mv }
    ];
  },
  async move(it, delta, type, o = {}) { await DB.batch(this.moveOps(it, delta, type, o)); }
};

defineApp('stock', {
  render(ctx) {
    const tab = ctx.parts[0] || 'items';
    const body = ctx.head({
      tabs: [{ id: 'items', label: '在庫一覧', icon: 'boxes' }, { id: 'low', label: '発注・製造', icon: 'cart' }, { id: 'moves', label: '入出庫の記録', icon: 'history' }, { id: 'take', label: '棚卸', icon: 'listcheck' }, { id: 'archive', label: '取り扱い終了', icon: 'archive' }], tab,

/* ---------- カメラで読んで追加：登録ずみ → 入庫、まだ → JANを入れて品目の登録 ---------- */
function stockScanAdd() {
  Scanner.open({
    title: 'カメラで読んで追加', formats: 'all', continuous: true, cooldown: 1500,
    hint: '商品のバーコード（JAN）か、在庫のラベル（品番）を枠に入れてください',
    intro: h('p.small.muted.mt0', '登録ずみの品目なら「入庫」、まだの品目なら、バーコードを入れた登録の画面を開きます。'),
    onCode: async (text, p) => {
      if (p.kind !== 'code' || !p.code) { beep(false); toast('在庫のバーコードではありません（IDカード・機材のQRは使えません）', 'err'); return true; }
      const code = p.code.trim();
      const it = await Stock.find(code).catch(() => null);
      if (it && it.archived) { beep(false); toast(`「${it.code} ${it.name}」は取り扱い終了になっています（「取り扱い終了」タブで戻せます）`, 'err', 6000); return true; }
      beep(true);
      if (it) { setTimeout(() => moveForm(it, 'in'), 30); return false; }
      const jan = /^\d{8,14}$/.test(code);
      if (!jan && !/^[A-Za-z0-9\-_.]{2,24}$/.test(code)) { beep(false); toast('読み取れた文字が品番・JANの形ではありません。もう一度読んでください', 'err'); return true; }
      setTimeout(() => { itemForm(null, jan ? { jan: code, kind: '商品' } : { code }); toast(jan ? `JAN ${code} を入れました。品名などを入れて保存してください` : `品番 ${code} を入れました`, '', 5000); }, 30);
      return false;
    }
  });
}

const Shop = {
  /** お客さま向けのページのURL（ポータルと同じ場所の shop/） */
  url() { try { return new URL('shop/', location.href.split('#')[0]).href; } catch { return 'shop/'; } },
  /** お店のページを新しいタブで開く。サインインは「このタブだけ」なので、window.open で開いてタブの中身（サインイン）を写す
      （同じサイトの自分たちのページなので、opener を残しても問題ない。ふつうのリンクで開くと、お客さまの見え方になる） */
  openPage(e) {
    if (e && (e.ctrlKey || e.metaKey || e.shiftKey || e.button)) return;   // 修飾キー付きは、ブラウザのふつうの動きにまかせる
    if (e) e.preventDefault();
    const w = window.open(Shop.url(), '_blank');
    if (!w) location.href = Shop.url();
  },
  flow(o) { return ['受付', '確認済み', '入金確認', o && o.needsAddress ? '発送済み' : '受け渡し済み', '完了']; },
  /** 公開用の在庫の数（実際の数は出さない：注文できる上限〔10以上〕まで） */
  publicStock(avail, p) {
    const cap = Math.max(10, Math.min(99, Math.round(Number(p && p.maxQty) || 10)));
    return Math.max(0, Math.min(cap, Math.floor(Number(avail) || 0)));
  },
  _codes: new Set(), _timer: 0,
  /** 在庫が動いたら呼ぶ（少し待ってまとめて、ネットの在庫の数をそろえる） */
  later(code) {
    if (!code || !state.member || !isStaff()) return;
    this._codes.add(String(code));
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const cs = [...this._codes]; this._codes.clear();
      this.sync(cs).catch((e) => console.warn('ネットショップの在庫の数をそろえられませんでした（1時間ごとに裏方GASでもそろえます）', e));
    }, 2500);
  },
  /** 取り置き中の数（確認済みより先で、まだ出庫していない注文。exceptNo の注文は除く） */
  async reserved(exceptNo) {
    const rows = await DB.list('shopOrders', { where: [['stockOut', '==', false]], limit: 2000 });
    const m = {};
    rows.filter((o) => shopHolds(o) && o.id !== exceptNo).forEach((o) => (o.lines || []).forEach((l) => { if (l.code) m[l.code] = (m[l.code] || 0) + (Number(l.qty) || 0); }));
    return m;
  },
  /** ネットの在庫の数をそろえる（codes＝品番の配列、'all'＝全部）。取り扱い終了の品目は、掲載をやめる */
  async sync(codes) {
    let prods;
    if (codes === 'all') prods = await DB.list('shopProducts', { limit: 2000 });
    else prods = (await Promise.all(uniq(codes).map((c) => DB.get('shopProducts/' + c).catch(() => null)))).filter(Boolean);
    if (!prods.length) return 0;
    const res = await this.reserved();
    const ops = [];
    for (const p of prods) {
      const it = await DB.get('items/' + p.id).catch(() => null);
      const live = !!it && !it.archived;
      const stock = this.publicStock(live ? (Number(it.qty) || 0) - (res[p.id] || 0) : 0, p);
      const patch = {};
      if (p.stock !== stock) patch.stock = stock;
      if (!live && p.visible) patch.visible = false;
      if (Object.keys(patch).length) ops.push({ op: 'update', path: 'shopProducts/' + p.id, data: { ...patch, stockAt: DB.now() } });
    }
    if (ops.length) await DB.batch(ops);
    return ops.length;
  },
  /** ホームのアイコンの「新しい注文」 */
  startBadge() {
    return DB.watch('shopOrders', { where: [['status', '==', '受付']] }, (r) => {
      const n = r.filter((x) => !x.test).length;
      Badges.set('shop', n ? { text: `新しい注文 ${n}`, n } : null);
    }, () => {});
  }
};

const shopLog = (text) => DB.union({ at: new Date(), by: myName(), text });

async function shopSetStatus(o, s) {
  // 「受付」から進めるとき（ここから取り置きになる）：在庫が足りるかを見る
  if (o.status === '受付' && s !== 'キャンセル' && !o.test) {
    const short = await shopShortages(o).catch(() => []);
    if (short.length && !await ask(`在庫が足りない品目があります（ほかの確認済みの注文で取り置き中の分を引いています）：\n${short.join('\n')}\n\nそれでも進めますか？（入荷・製作の見込みをお客さまに伝えてから）`, { ok: '進める' })) return;
  }
  // 発送・受け渡し・完了にするとき、出庫がまだなら先に出庫する
  if (['発送済み', '受け渡し済み', '完了'].includes(s) && !o.stockOut && !o.test) {
    if (!await ask(`在庫からの出庫がまだです。出庫してから「${s}」にしますか？\n（在庫を別に動かした場合は、右上の「…」→「出庫済みにする」）`, { ok: '出庫して進める' })) return;
    if (!await shopStockOut(o, null, true)) return;
  }
  await act(null, () => DB.update('shopOrders/' + o.id, { status: s, updatedAt: DB.now(), ...(s === '完了' ? { doneAt: today() } : {}), log: shopLog(`状態を「${s}」にしました`) }), `「${s}」にしました`);
  (o.lines || []).forEach((l) => Shop.later(l.code));   // 取り置きの数が変わるので、ネットの在庫の数もそろえる
}
/** この注文を取り置きにしたら足りない品目（受注生産は見ない） */
async function shopShortages(o) {
  const res = await Shop.reserved(o.id);
  const out = [];
  for (const l of (o.lines || [])) {
    if (!l.code || l.madeToOrder) continue;
    const it = await DB.get('items/' + l.code).catch(() => null);
    const avail = it && !it.archived ? (Number(it.qty) || 0) - (res[l.code] || 0) : 0;
    if (avail < (Number(l.qty) || 0)) out.push(`・${l.code} ${l.name}：注文 ${l.qty}／出せる数 ${Math.max(0, avail)}`);
  }
  return out;
}
async function shopStockOut(o, b, quiet) {
  if (o.test) { toast('テスト注文は在庫を動かしません'); return false; }
  const lines = (o.lines || []).filter((l) => l.code && Number(l.qty) > 0);
  if (!quiet && !await ask(`この注文の ${lines.length} 品目を、在庫から出庫しますか？（「販売」として在庫が減ります）`, { ok: '出庫する' })) return false;
  const r = await act(b, async () => {
    const ops = [], miss = [];
    for (const l of lines) { const it = await DB.get('items/' + l.code); if (it) ops.push(...Stock.moveOps(it, -(Number(l.qty) || 0), '販売', { ref: o.no, refId: o.id, note: 'ネット注文' })); else miss.push(l.code); }
    ops.push({ op: 'update', path: 'shopOrders/' + o.id, data: { stockOut: true, stockOutAt: today(), stockOutBy: myName(), updatedAt: DB.now(), log: shopLog('在庫から出庫しました' + (miss.length ? `（在庫管理にない品番：${miss.join('、')}）` : '')) } });
    if (o.orderId) ops.push({ op: 'update', path: 'orders/' + o.orderId, data: { stockOut: true, stockOutAt: today() } });
    await DB.batch(ops, { wait: true });
    return true;
  }, '在庫から出庫しました');
  return r === true;
}
async function shopMarkStockOut(o) {
  if (!await ask('在庫は動かさずに「出庫済み」にしますか？（在庫管理で、もう別に出庫した場合だけ）', { ok: '出庫済みにする' })) return;
  await act(null, async () => {
    await DB.update('shopOrders/' + o.id, { stockOut: true, stockOutAt: today(), stockOutBy: myName(), updatedAt: DB.now(), log: shopLog('出庫済みにしました（在庫は動かしていません）') });
    (o.lines || []).forEach((l) => Shop.later(l.code));
  }, '出庫済みにしました');
}
async function shopCancel(o) {
  const why = await askText('キャンセルの理由（記録に残ります）', { message: `注文 ${o.no} をキャンセルにします。お客さまへの連絡は「お客さまにメール」→「キャンセルのご連絡」から。`, ok: 'キャンセルにする', required: true, max: 200 });
  if (!why) return;
  let back = false;
  if (o.stockOut && !o.test && await ask('出庫ずみの商品を、在庫に戻しますか？（商品が手元に戻ってきたときだけ）', { ok: '在庫に戻す', cancel: '戻さない' })) back = true;

      delivery: (o.delivery || {}).label || '', payMethod: (o.payment || {}).label || '', shopOrderNo: o.no,

let routerStarted = false;
function onReady() {
  const staff = isStaff();
  state.unsub.push(Org.watch());
  if (staff) {
    state.unsub.push(Dir.start());
    state.unsub.push(Live.doc('config/appLinks').on((d) => { state.appLinks = d || {}; if (!Router.current && location.hash.replace(/^#\/?/, '') === '') { /* ホームの再描画はリンク未設定の表示だけなので、次に開いたときに反映 */ } }));
    state.unsub.push(Chat.start());
    state.unsub.push(Requests.startBadge());
    state.unsub.push(Shop.startBadge());
  }
  if (!routerStarted) { routerStarted = true; Router.start(); } else Router.resolve();
}
async function onSignedIn(user) {
  let member = null;
  try { member = await DB.get('members/' + user.uid); }
  catch (e) { screenPending('会員情報を読み込めませんでした：' + errText(e)); return; }
  if (!member || member.active !== true) { screenPending(); return; }
  if (member.role === 'kiosk') {
    // キオスク用アカウント：この端末をキオスク専用にして、再起動してもサインインしたままにする（2段階認証は使わない）
    store.set('mtic-kiosk-device', '1'); store.sset('mtic-nokeep', null);
    if (state.shared) { state.shared = false; store.sset('mtic-shared', null); }
    fb.A.setPersistence(fb.auth, fb.A.indexedDBLocalPersistence).catch(() => {});
  } else if (KIOSK_KEEP) {
    // キオスクの端末で職員がサインインした：職員のデータが端末に残らない形（このタブだけ）で読み込みなおす
    store.sset('mtic-nokeep', '1'); state.reloading = true; location.reload(); return;
  }
  state.user = user;
  state.member = { ...member, id: user.uid, email: member.email || user.email };
  const kind = store.sget('mtic-just');
  if (kind) { markJust(null); Auth.afterSignIn(kind).catch(() => {}); }   // ログインの記録とお知らせ（2段階認証の登録前でも残す）
  // 2段階認証（認証アプリ）：職員・管理者・責任者は、登録が済むまでポータルを使えない
  if (Mfa.needed(state.member) && !Mfa.hasTotp() && !state.mfaSkip) {
    screenMfaEnroll(user, () => { state.mfaSkip = true; toast('2段階認証なしで続けています（設定が済んだら登録してください）', '', 6000); ready(); });
    return;
  }
  ready();
  function ready() {
    if (isOwner()) DB.get('directory/' + user.uid).then((d) => { if (!d) return DB.set('directory/' + user.uid, { name: member.name || '', role: 'owner', active: true, memberNo: member.memberNo || '' }); }).catch(() => {});
    onReady();
  }
}
async function startDemo() {
  state.mode = 'demo';
  store.sset('mtic-demo', '1');
  DB.use(MemEngine('mtic-demo-v2'), 'demo');
  if (!store.get('mtic-demo-seeded') || DB.engine.size() === 0) {
    mount($('#root'), h('div.boot', h('div', { style: { textAlign: 'center' } }, h('div.spinner', { style: { margin: '0 auto' } }), h('p.muted', 'デモのデータを準備しています…'))));
    await seedDemo();
    store.set('mtic-demo-seeded', '1');
  }
  const r = state.demoRole || 'owner';
  const uid = { owner: 'demo-owner', admin: 'demo-admin', staff: 'demo-staff-a', kiosk: 'demo-kiosk' }[r] || 'demo-owner';
  const m = await DB.get('members/' + uid);
  state.member = { ...m, id: uid };
  onReady();
}
async function start() {
  const configured = CONFIG.FIREBASE.apiKey && CONFIG.FIREBASE.projectId;
  if (!configured) {
    if (store.sget('mtic-demo') === '1') { startDemo(); return; }
    screenSetup(() => startDemo());
    return;
  }
  try { await loadFirebase(); }
  catch (e) { console.error(e); screenSetup(null, 'サインインのしくみを読み込めませんでした。ネットワークを確認して、ページを再読み込みしてください。'); $('#root .btn') && $('#root .btn').remove(); return; }
  state.mode = 'live';
  DB.use(FsEngine(fb.F, fb.db), 'live');
  const handled = await handleActionLink();
  fb.A.onAuthStateChanged(fb.auth, (user) => {
    if (state.reloading) return;
    if (user) { if (state.settingPw && !store.sget('mtic-just')) return; onSignedIn(user); }
    else {
      state.user = null; state.member = null; state.mfaSkip = false;
      closeAllDialogs();
      state.unsub.forEach((u) => { try { u(); } catch { /* なし */ } }); state.unsub = [];
      Live.reset();
      if (!handled || !state.settingPw) screenSignin();
    }
  });
}
window.addEventListener('error', (e) => { console.error('エラー', e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { console.error('エラー（約束）', e.reason); });
start();
// テスト・点検用（URLに ?debug をつけたときだけ、中の道具を外から呼べるようにする）
