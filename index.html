<title>M-TIC職員ポータル</title>
<style>
:root{
  --brand:#0043A8; --brand-ink:#0043A8; --brand-dark:#00368a; --accent:#F97300;
  --bg:#FFFFFF; --bg-soft:#F5F7FB; --bg-softer:#FAFBFD; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280; --line:#E3E8F0; --line-strong:#CBD3E1;
  --danger:#C62828; --ok:#1E8E3E; --warn:#B45309;
  --t-blue-bg:#E7EEFB; --t-blue-fg:#0043A8;
  --t-orange-bg:#FFF0E2; --t-orange-fg:#B45309;
  --t-violet-bg:#EFEAFE; --t-violet-fg:#5B3CC4;
  --t-aqua-bg:#E2F5F2; --t-aqua-fg:#0F766E;
  --t-gray-bg:#EEF0F3; --t-gray-fg:#4B5563;
  --t-red-bg:#FDECEC; --t-red-fg:#B42318;
  --t-green-bg:#E6F4EA; --t-green-fg:#1E7B34;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-hover:0 12px 28px rgba(16,24,40,.13);
  --radius:16px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --brand-ink:#8DB2FF; --bg:#0E1320; --bg-soft:#141B2B; --bg-softer:#111827; --surface:#182033; --text:#E6E9EF; --muted:#9AA4B5; --line:#283247; --line-strong:#38445c;
  --danger:#FF8A80; --ok:#7BD88F; --warn:#FFB869;
  --t-blue-bg:#1B2B4D; --t-blue-fg:#9EC0FF; --t-orange-bg:#3A2716; --t-orange-fg:#FFB869;
  --t-violet-bg:#2B2347; --t-violet-fg:#C7B8FF; --t-aqua-bg:#123632; --t-aqua-fg:#7FDCCF; --t-gray-bg:#232B3B; --t-gray-fg:#C2C9D6;
  --t-red-bg:#3a1b1b; --t-red-fg:#FF9C94; --t-green-bg:#16301f; --t-green-fg:#8EE0A2;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 12px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{line-height:1.35}
.hidden,[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.mono{font-family:var(--mono)}
.nw{white-space:nowrap}
.right{text-align:right}
.center-t{text-align:center}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:8px}
.sp{flex:1}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.num{font-variant-numeric:tabular-nums}
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--bg-soft)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px;gap:4px}
.btn.lg{height:52px;padding:0 22px;font-size:16px;border-radius:12px}
.btn.xl{height:72px;padding:0 26px;font-size:20px;border-radius:16px;font-weight:700}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand-ink);cursor:pointer;padding:4px 0;font-size:13px;text-decoration:underline}
label.field,.field{display:block;margin:0 0 12px}
.field>span.lb,label.field>span:first-child{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field .req{color:var(--danger);margin-left:3px}
.field .help{font-size:12px;color:var(--muted);margin-top:3px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=search],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=datetime-local],input[type=month],select,textarea{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=number]{text-align:right}
input.inp-sm,select.inp-sm{height:34px;border-radius:8px;padding:0 8px;font-size:14px}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input[readonly]{background:var(--bg-soft)}
input:invalid{box-shadow:none}
.inp-unit{display:flex;align-items:center;gap:6px}
.inp-scan{display:flex;align-items:center;gap:6px}.inp-scan>input,.inp-scan>div{flex:1;min-width:0}.inp-scan>.btn{flex:none}
.inp-unit>span{color:var(--muted);font-size:13px;white-space:nowrap}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:46px}
.pw-wrap .eye{position:absolute;right:4px;top:4px;height:34px;width:38px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0 12px;cursor:pointer}
.check input{margin-top:4px;width:16px;height:16px;flex:none}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 12px}
.form>.field,.form>.full{grid-column:span 6}
.form>.w1{grid-column:span 1}.form>.w2{grid-column:span 2}.form>.w3{grid-column:span 3}.form>.w4{grid-column:span 4}.form>.w5{grid-column:span 5}
.form>h4{grid-column:span 6;margin:8px 0 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
@media (max-width:639px){.form>.w1,.form>.w2,.form>.w3,.form>.w4,.form>.w5{grid-column:span 6}.form>.w1.keep,.form>.w2.keep{grid-column:span 3}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on,.chip:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.chip.ok.on,.chip.ok:has(input:checked){background:var(--ok);border-color:var(--ok)}
.chip.ng.on,.chip.ng:has(input:checked){background:var(--danger);border-color:var(--danger)}
.chip.mid.on,.chip.mid:has(input:checked){background:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;margin:8px 0}
.msg.err{background:var(--t-red-bg);color:var(--t-red-fg)}
.msg.ok{background:var(--t-green-bg);color:var(--t-green-fg)}
.msg.info{background:var(--bg-soft);color:var(--muted)}
.msg.warn{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.tip{font-size:12.5px;color:var(--muted);background:var(--bg-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--t-orange-bg);color:var(--t-orange-fg);font-weight:600;white-space:nowrap}
.badge.blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.badge.gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}

.badge.green{background:var(--t-green-bg);color:var(--t-green-fg)}
.badge.violet{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.badge.aqua{background:var(--t-aqua-bg);color:var(--t-aqua-fg)}
.st{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.c-blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.c-orange{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.c-violet{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.c-aqua{background:var(--t-aqua-bg);color:var(--t-aqua-fg)}
.c-gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}
.c-red{background:var(--t-red-bg);color:var(--t-red-fg)}
.c-green{background:var(--t-green-bg);color:var(--t-green-fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}.dot.warn{background:var(--accent)}.dot.ng{background:var(--danger)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700}
.count.blue{background:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--t-blue-bg);color:var(--t-blue-fg);font-size:11px;font-weight:700;border:0;white-space:nowrap;letter-spacing:-.03em;overflow:hidden;flex:none}
button.avatar{cursor:pointer}
.avatar.sm{width:28px;height:28px;font-size:10px}
.avatar.lg{width:56px;height:56px;font-size:16px}
.center{display:flex;align-items:center;justify-content:center;padding:32px 16px;min-height:100vh;background:var(--bg-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:420px}
.card.wide{max-width:560px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--brand-ink)}

.logo img{height:34px;width:auto}
.card h1{font-size:20px;margin:14px 0 4px}

ul.rules li.ok{color:var(--ok)}
ul.rules li.ok::before{content:"✓ ";}

.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 2px}

main.home{max-width:1240px;margin:0 auto;padding:20px 20px 40px}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi.warn{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--t-orange-bg)}
.kpi.ng{border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:var(--t-red-bg)}
.empty{color:var(--muted);font-size:14px;padding:30px 12px;text-align:center}
.empty .btn{margin-top:10px}
.loading{display:flex;justify-content:center;padding:30px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.progress>div{height:100%;background:var(--brand);border-radius:99px}
.progress.ok>div{background:var(--ok)}
.sticky-foot{position:sticky;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:5}
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg-softer);position:sticky;top:0;z-index:1}
table.list th.sortable{cursor:pointer;user-select:none}
table.list th.sortable:hover{color:var(--text)}
table.list td.nw,table.list th.nw{white-space:nowrap}
table.list td.r,table.list th.r{text-align:right;font-variant-numeric:tabular-nums}
table.list td.c,table.list th.c{text-align:center}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--bg-soft)}
table.list tr.dim td{opacity:.55}
table.list tr.warn td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
table.list tr.ng td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
table.list tfoot td{font-weight:700;border-top:2px solid var(--line-strong)}
table.list.compact th,table.list.compact td{padding:6px 6px}
table.list input,table.list select{height:34px;border-radius:8px;padding:0 8px;font-size:14px}
table.edit td{padding:4px}
.rowact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cardlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.rcard:hover{border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.rcard .main{flex:1;min-width:0}
.rcard .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.rcard .s{font-size:12.5px;color:var(--muted)}
dialog.dlg{border:0;border-radius:20px;padding:0;max-width:min(760px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--text);box-shadow:var(--shadow-hover);max-height:calc(100dvh - 24px)}
dialog.dlg::backdrop{background:rgba(10,15,30,.45)}
dialog.dlg.sm{max-width:min(440px,calc(100vw - 24px))}
dialog.dlg.lg{max-width:min(1040px,calc(100vw - 24px))}
dialog.dlg.xl{max-width:min(1240px,calc(100vw - 24px))}
dialog.dlg>.dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.dlg-h h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-b{padding:16px 18px;overflow:auto;flex:1 1 auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;flex:none}
.dlg-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:639px){
  dialog.dlg,dialog.dlg.sm,dialog.dlg.lg,dialog.dlg.xl{max-width:100vw;width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  dialog.dlg.sm{height:auto;max-height:90dvh;border-radius:18px 18px 0 0;margin:auto 0 0}
  dialog.dlg>.dlg-in{max-height:100dvh;height:100%}
  .dlg-b{padding:14px}
}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:1000;box-shadow:var(--shadow-hover);max-width:calc(100vw - 32px);text-align:center}
.toast.err{background:#B42318}
.toast.ok{background:#1E7B34}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gantt table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.gantt th,.gantt td{border-bottom:1px solid var(--line);padding:0;height:30px;white-space:nowrap}
.gantt th{position:sticky;top:0;background:var(--bg-softer);z-index:2;font-weight:600;color:var(--muted);font-size:11px}
.gantt .gname{position:sticky;left:0;background:var(--surface);z-index:1;padding:0 8px;min-width:220px;max-width:260px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.gantt th.gname{z-index:3;background:var(--bg-softer)}
.gantt .gday{width:26px;min-width:26px;text-align:center;border-left:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.gantt .gday.we{background:color-mix(in srgb,var(--bg-soft) 70%,transparent)}
.gantt .gday.today{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.gantt .bar{height:16px;background:var(--brand);margin:0 -1px;position:relative}
.gantt .bar.bs{border-radius:5px 0 0 5px;margin-left:2px}.gantt .bar.be{border-radius:0 5px 5px 0;margin-right:2px}.gantt .bar.bs.be{border-radius:5px}
.gantt .bar.child{background:color-mix(in srgb,var(--brand) 60%,#fff)}
.gantt .bar.done{background:var(--ok)}
.gantt .bar.late{background:var(--danger)}
.gantt .bar .pg{position:absolute;inset:0;background:rgba(255,255,255,.35);border-radius:5px}
.tree-child td:first-child{padding-left:26px}
.countdown{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#2a6ae0);color:#fff;margin:0 0 14px}
.countdown .d{font-size:34px;font-weight:800;line-height:1}
.countdown .g{font-size:14px;opacity:.95}
.countdown .btn{margin-left:auto;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;font-size:13.5px}
.mcard.in{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:var(--t-green-bg)}
.mcard.stale{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--t-orange-bg)}
.mcard .nm{font-weight:700}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.eq .code{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--brand-ink)}
.eq .nm{font-weight:700;line-height:1.35}
.eq.inuse{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(180deg,var(--t-orange-bg),var(--surface) 70%)}
.eq.maint{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.eq .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.kiosk{min-height:100vh;background:var(--bg-soft);display:flex;flex-direction:column}
.kiosk .kh{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.kiosk .kh .clock{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kiosk .kb{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.kiosk .kbox{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:880px;text-align:center}
.kiosk .kbig{font-size:28px;font-weight:800;margin:6px 0}
.kiosk .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
.kiosk .kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;cursor:pointer;padding:10px}
.kiosk .kbtn:hover{border-color:var(--brand)}
.kiosk .kbtn.go{background:var(--brand);border-color:var(--brand);color:#fff}
.kiosk .kbtn.stop{background:var(--accent);border-color:var(--accent);color:#fff}
.kiosk .kbtn.in{background:var(--ok);border-color:var(--ok);color:#fff}
.kiosk .kbtn.busy{opacity:.55}
.kiosk .kbtn small{font-weight:500;font-size:13px;opacity:.9}
.scanbox{position:relative;width:100%;max-width:560px;margin:0 auto;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.scanbox .frame.wide{inset:30% 6%}
.scanbox .hit{position:absolute;inset:0;background:rgba(30,142,62,.35);opacity:0;transition:opacity .15s}
.scanbox .hit.on{opacity:1}
.scanbox .scanmsg{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.scanbox.mirror video{transform:scaleX(-1)}
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:899px){.pos{grid-template-columns:1fr}}
.pos .cart table.list td{padding:8px 6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;border:0;background:var(--bg-soft);cursor:pointer;font-size:18px}
.qty input{width:52px;height:36px;border:0;border-radius:0;text-align:center;padding:0}
.pos .total{font-size:40px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.pos .total small{font-size:15px;color:var(--muted);font-weight:600}
.pos .paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos .keypad button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
.pos .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pos .prod{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:72px;display:flex;flex-direction:column;gap:2px}
.pos .prod:hover{border-color:var(--brand)}
.pos .prod b{font-size:13.5px;line-height:1.3}
.pos .prod span{font-size:13px;color:var(--muted)}
.pos .prod.out{opacity:.5}
.custdisp{position:fixed;inset:0;background:#0b1a3a;color:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.custdisp .amt{font-size:min(16vw,120px);font-weight:800;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .dow{background:var(--bg-softer);font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.cal .dow.sun,.cal .day.sun .dn{color:var(--danger)}
.cal .dow.sat,.cal .day.sat .dn{color:var(--brand-ink)}
.cal .day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;font-size:12px;cursor:pointer;overflow:hidden}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--bg-softer);color:var(--muted)}
.cal .day.today{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.cal .day .dn{font-weight:700;font-size:12.5px}
.ev{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11.5px;background:var(--t-blue-bg);color:var(--t-blue-fg)}
.ev.k-teirei{background:var(--t-orange-bg);color:var(--t-orange-fg)}.ev.k-soukai{background:var(--t-red-bg);color:var(--t-red-fg)}.ev.k-katsudo{background:var(--t-green-bg);color:var(--t-green-fg)}.ev.k-event{background:var(--t-violet-bg);color:var(--t-violet-fg)}
.cal .ev{display:block;border-radius:5px;padding:1px 5px;margin:2px 0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--t-blue-bg);color:var(--t-blue-fg)}
.cal .ev.k-teirei{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.cal .ev.k-soukai{background:var(--t-red-bg);color:var(--t-red-fg)}
.cal .ev.k-katsudo{background:var(--t-green-bg);color:var(--t-green-fg)}
.cal .ev.k-event{background:var(--t-violet-bg);color:var(--t-violet-fg)}
@media (max-width:639px){.cal .day{min-height:64px;padding:2px}.cal .ev{font-size:10px;padding:0 3px}}
.poll{border-collapse:collapse;font-size:13px}
.poll th,.poll td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.poll th.nm,.poll td.nm{text-align:left;position:sticky;left:0;background:var(--surface)}
.poll .best{background:var(--t-green-bg)}
.poll .mk-o{color:var(--ok);font-weight:800}
.poll .mk-t{color:var(--warn);font-weight:800}
.poll .mk-x{color:var(--danger);font-weight:800}
.mark3{display:inline-flex;gap:4px}
.mark3 button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer}
.mark3 button.on.o{background:var(--ok);color:#fff;border-color:var(--ok)}
.mark3 button.on.t{background:var(--accent);color:#fff;border-color:var(--accent)}
.mark3 button.on.x{background:var(--danger);color:#fff;border-color:var(--danger)}
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100dvh - 57px);max-width:1440px;margin:0 auto}
.chat .side{border-right:1px solid var(--line);overflow:auto;background:var(--bg-softer);padding:10px}
.chat .side h4{font-size:12px;color:var(--muted);margin:12px 6px 4px;display:flex;align-items:center;gap:6px}
.chat .side h4 .btn{margin-left:auto}
.chat .ch{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-size:14px;color:var(--text)}
.chat .ch:hover{background:var(--bg-soft)}
.chat .ch.on{background:var(--t-blue-bg);color:var(--t-blue-fg);font-weight:700}
.chat .ch.unread{font-weight:800}
.chat .ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat .ph h2{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.chat .day-sep{text-align:center;font-size:12px;color:var(--muted);margin:12px 0 6px}
.chat .day-sep span{background:var(--bg-soft);padding:2px 10px;border-radius:999px}
.chat .m{display:flex;gap:10px;padding:4px 6px;border-radius:10px;position:relative}
.chat .m:hover{background:var(--bg-softer)}
.chat .m.cont{padding-top:0}
.chat .m.cont .avatar{visibility:hidden;height:0}
.chat .m .body{flex:1;min-width:0}
.chat .m .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.chat .m .meta b{color:var(--text);font-size:13.5px}
.chat .m .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.chat .m.mention{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.chat .m.sys .txt{color:var(--muted);font-size:13.5px}
.chat .m .acts{position:absolute;right:6px;top:-10px;display:none;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.chat .m:hover .acts{display:flex}
.chat .files{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chat .file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);cursor:pointer;max-width:320px;font-size:13px}
.chat .file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .thumb{border-radius:10px;border:1px solid var(--line);max-width:240px;max-height:200px;cursor:pointer;display:block}
.chat .composer{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.chat .composer textarea{min-height:44px;max-height:180px}
.chat .composer .pend{display:flex;gap:6px;flex-wrap:wrap}
.chat .drop{outline:3px dashed var(--brand);outline-offset:-8px}
.chat .back-btn{display:none}
@media (max-width:767px){
  .chat{grid-template-columns:1fr;height:calc(100dvh - 53px)}
  .chat .side{border-right:0}
  .chat.show-pane .side{display:none}
  .chat:not(.show-pane) .pane{display:none}
  .chat .back-btn{display:inline-flex}
  .chat .m .acts{display:flex;position:static;border:0;background:none;padding:0;margin-left:auto}
}
.steps{display:flex;flex-direction:column;gap:10px}

.step.done .kind{background:var(--t-green-bg);color:var(--t-green-fg)}

.checklist li:last-child{border-bottom:0}

.checklist li.on span.t{color:var(--muted);text-decoration:line-through}
.ok-t{color:var(--ok);font-weight:700}.ng-t{color:var(--danger);font-weight:700}
.qrbox{display:inline-block;padding:8px;background:#fff;border-radius:10px}
.qrbox svg{display:block}
.drop-zone{border:2px dashed var(--line-strong);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop-zone.on{border-color:var(--brand);background:var(--t-blue-bg)}
.linkgroup h3{font-size:13px;color:var(--muted);margin:16px 0 6px}
.linkitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.linkitem a{font-weight:600;text-decoration:none}
.linkitem .note{font-size:12px;color:var(--muted)}
.linkitem .rowact{margin-left:auto}
ul.diag{list-style:none;padding:0;margin:0}.diag li{padding:4px 0}
.hl{background:color-mix(in srgb,var(--accent) 25%,transparent);border-radius:3px}
